<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadline Necromancer — 3D Office Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#eee}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .badge{background:#000a;border:1px solid #fff2;border-radius:10px;padding:8px 14px;backdrop-filter:blur(6px)}
  .badge b{font-size:20px}
  .bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px)}
  button{background:#1d1a2e;color:#eee;border:1px solid #fff3;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
  button:hover{background:#2c2745} button.on{background:#6d4bd1;border-color:#b9a2ff}
  #flash{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .6s}
  #msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="badge">วันที่ <b id="day">1</b> / 5 · <span id="phase">MORNING</span></div>
  <div class="badge">Deadline <b id="dl">5</b> วัน</div>
</div>
<div id="msg"></div>
<div id="flash"></div>
<div class="bar">
  <button data-p="MORNING" class="on">☀ ประชุมเช้า</button>
  <button data-p="VOTE">🗳 โหวต</button>
  <button data-p="NIGHT">🌙 กลางคืน</button>
  <button id="kill">💀 ตัดผู้เล่นออก</button>
  <button id="next">⏭ วันถัดไป</button>
  <button id="orbit">🎥 กล้องหมุน: เปิด</button>
</div>

<script type="module">
import * as THREE from 'three';

const N = 9;                      // number of players
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1830, 14, 34);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 80);

const mat = (c, o={}) => new THREE.MeshStandardMaterial({color:c, roughness:.8, ...o});
const box = (w,h,d,m) => { const x = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); x.castShadow = x.receiveShadow = true; return x; };

// ---------- room ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(15, 48), mat(0x3a3550, {roughness:.95}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const rug = new THREE.Mesh(new THREE.CircleGeometry(4.2, 48), mat(0x5b3fa8, {roughness:1}));
rug.rotation.x = -Math.PI/2; rug.position.y = .01; rug.receiveShadow = true; scene.add(rug);

// back wall with windows (window panes glow = sky)
const wall = box(30, 8, .4, mat(0x4a4568)); wall.position.set(0, 4, -12); scene.add(wall);
const skyMat = new THREE.MeshBasicMaterial({color:0x9fd4ff});
for (let i=-2;i<=2;i++){
  const w = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 4.2), skyMat);
  w.position.set(i*5, 4.4, -11.78); scene.add(w);
  const fr = box(3.9, .15, .3, mat(0x222033)); fr.position.set(i*5, 6.55, -11.8); scene.add(fr);
  const fr2 = fr.clone(); fr2.position.y = 2.25; scene.add(fr2);
}
// city silhouettes behind the windows
const city = new THREE.Group();
for (let i=0;i<30;i++){
  const h = 1+Math.random()*4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(1+Math.random(), h, .5), new THREE.MeshBasicMaterial({color:0x2a2842}));
  b.position.set(-14+i*1, 2.3+h/2-.1, -11.9); city.add(b);
}
scene.add(city);

// ---------- central table: "deadline board" ----------
const table = new THREE.Group();
const top = box(2.6, .15, 2.6, mat(0x7a5a3a)); top.position.y = .9; table.add(top);
const leg = box(.3, .9, .3, mat(0x3a2a1a)); leg.position.y = .45; table.add(leg);
// 5 stacks of papers = 5 workdays; shrink as days pass
const stacks = [];
for (let i=0;i<5;i++){
  const s = box(.38, 1, .5, mat(0xf2efe6)); s.geometry.translate(0,.5,0);
  s.position.set(-1+i*.5, .98, 0); s.scale.y = .5; table.add(s); stacks.push(s);
}
const lamp = new THREE.PointLight(0xffd9a0, 0, 7); lamp.position.set(0, 3.2, 0); lamp.castShadow = true; table.add(lamp);
scene.add(table);

// ---------- desks (players) ----------
const desks = [];
for (let i=0;i<N;i++){
  const a = i/N * Math.PI*2, R = 6.2;
  const g = new THREE.Group();
  g.position.set(Math.sin(a)*R, 0, Math.cos(a)*R);
  g.rotation.y = a + Math.PI;                 // face the centre
  const d = box(2, .1, 1.1, mat(0xb9a07a)); d.position.y = .8; g.add(d);
  for (const sx of [-.9,.9]) { const l = box(.1,.8,.9, mat(0x55483a)); l.position.set(sx,.4,0); g.add(l); }
  const mon = new THREE.Group();
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(.8,.5), new THREE.MeshBasicMaterial({color:0x7fe3ff}));
  scr.position.set(0,1.3,.04);
  const bez = box(.9,.6,.06, mat(0x15141c)); bez.position.set(0,1.3,0);
  const stand = box(.08,.3,.08, mat(0x15141c)); stand.position.set(0,.98,0);
  mon.add(bez, scr, stand); mon.position.z = -.25; mon.rotation.y = Math.PI;   // screen faces the chair side
  mon.children.forEach(c=>{}); g.add(mon);
  // chair
  const chair = new THREE.Group();
  const seat = box(.7,.1,.7, mat(0x2d2a55)); seat.position.y = .55; chair.add(seat);
  const back = box(.7,.8,.1, mat(0x2d2a55)); back.position.set(0,1,.35); chair.add(back);
  const post = box(.1,.5,.1, mat(0x111)); post.position.y = .27; chair.add(post);
  chair.position.z = 1.05; chair.rotation.y = Math.PI; g.add(chair);
  // worker: capsule body + head, sits in the chair
  const worker = new THREE.Group();
  const col = new THREE.Color().setHSL(i/N, .55, .55);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.26,.45,4,10), mat(col)); body.position.y = 1.15; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.22,16,12), mat(0xf1c9a5)); head.position.y = 1.8; head.castShadow = true;
  worker.add(body, head); worker.position.z = 1.0; g.add(worker);
  // name tag
  const tag = makeTag('P'+(i+1)); tag.position.set(0, 2.5, 1.0); g.add(tag);
  scene.add(g);
  desks.push({g, scr, worker, tag, alive:true, angle:a, bob:Math.random()*6});
}
function makeTag(text){
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const x = c.getContext('2d'); x.fillStyle = '#000b'; x.roundRect(0,0,256,96,18); x.fill();
  x.fillStyle = '#fff'; x.font = '700 52px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text,128,50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthTest:false}));
  s.scale.set(1.2,.45,1); s.renderOrder = 10; return s;
}

// ---------- ghost particles (night) ----------
const P = 220, pg = new THREE.BufferGeometry(), pp = new Float32Array(P*3), pv = [];
for (let i=0;i<P;i++){ pp[i*3]=(Math.random()-.5)*20; pp[i*3+1]=Math.random()*6; pp[i*3+2]=(Math.random()-.5)*20; pv.push(.2+Math.random()*.5); }
pg.setAttribute('position', new THREE.BufferAttribute(pp,3));
const pm = new THREE.PointsMaterial({color:0xb48cff, size:.14, transparent:true, opacity:0, depthWrite:false});
scene.add(new THREE.Points(pg, pm));

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera, {left:-12,right:12,top:12,bottom:-12});
scene.add(hemi, sun);

// ---------- phase presets ----------
const PRESET = {
  MORNING:{sky:0x9fd4ff, fog:0x8fb4d8, hemi:1.0, sun:1.6, sunC:0xfff1d6, lamp:0,   mon:0x7fe3ff, part:0,  cam:{r:13.5,h:7.5,fov:50}, label:'ประชุมเช้า'},
  VOTE:   {sky:0xffc07a, fog:0xb88a60, hemi:.8,  sun:.9,  sunC:0xffb070, lamp:1.2, mon:0xffd27f, part:0,  cam:{r:9.5, h:5.2,fov:46}, label:'โหวต'},
  NIGHT:  {sky:0x0a0820, fog:0x0a0820, hemi:.18, sun:.12, sunC:0x7a6cff, lamp:0.5, mon:0x8a5bff, part:.9, cam:{r:12,  h:9.5,fov:55}, label:'กลางคืน'},
};
let phase = 'MORNING', cur = structuredClone({...PRESET.MORNING});
const tgtColor = new THREE.Color(), tmp = new THREE.Color();
const lerpHex = (a, b, t) => { tmp.set(a); tgtColor.set(b); return tmp.lerp(tgtColor, t).getHex(); };
function setPhase(p){
  phase = p;
  document.getElementById('phase').textContent = PRESET[p].label;
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  say(PRESET[p].label);
  if (p === 'NIGHT'){ flash(.55); }
}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick = ()=>setPhase(b.dataset.p));

// ---------- HUD helpers ----------
let day = 1;
const msg = document.getElementById('msg'), fl = document.getElementById('flash');
function say(t){ msg.textContent = t; msg.style.opacity = 1; clearTimeout(say.t); say.t = setTimeout(()=>msg.style.opacity=0, 1300); }
function flash(a){ fl.style.opacity = a; setTimeout(()=>fl.style.opacity = 0, 350); }
function setDay(d){
  day = d; document.getElementById('day').textContent = d; document.getElementById('dl').textContent = 6-d;
  stacks.forEach((s,i)=> s.userData.target = i < 6-d ? .5 + (5-i)*.08 : .05);
}
setDay(1);
document.getElementById('next').onclick = ()=>{ if (day<5) { setDay(day+1); setPhase('MORNING'); } else say('Deadline มาถึงแล้ว!'); };
document.getElementById('kill').onclick = ()=>{
  const alive = desks.filter(d=>d.alive); if (alive.length <= 1) return;
  const v = alive[Math.floor(Math.random()*alive.length)];
  v.alive = false; v.dying = 0; v.tag.visible = false;
  say('มีคนหมดแรง…');
  flash(.35);
};
let orbit = true;
document.getElementById('orbit').onclick = e=>{ orbit = !orbit; e.target.textContent = '🎥 กล้องหมุน: ' + (orbit?'เปิด':'ปิด'); };

// ---------- loop ----------
const clock = new THREE.Clock();
let camAngle = .3;
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const k = 1 - Math.pow(.02, dt);                        // smooth ease factor
  const T = PRESET[phase];

  // lighting / sky tween
  cur.sky = lerpHex(cur.sky, T.sky, k); cur.fog = lerpHex(cur.fog, T.fog, k);
  cur.sunC = lerpHex(cur.sunC, T.sunC, k); cur.mon = lerpHex(cur.mon, T.mon, k);
  for (const key of ['hemi','sun','lamp','part']) cur[key] += (T[key]-cur[key])*k;
  skyMat.color.set(cur.sky); scene.fog.color.set(cur.fog); scene.background = scene.fog.color;
  hemi.intensity = cur.hemi; sun.intensity = cur.sun; sun.color.set(cur.sunC); lamp.intensity = cur.lamp*20;
  pm.opacity = cur.part * .8;
  city.children.forEach(b=>b.material.color.set(phase==='NIGHT'?0x070614:0x7da4c8));

  // camera: orbit around the table, radius/height from phase
  if (orbit) camAngle += dt*(phase==='NIGHT'?.05:.08);
  cur.r = (cur.r ?? T.cam.r) + (T.cam.r-(cur.r ?? T.cam.r))*k;
  cur.h = (cur.h ?? T.cam.h) + (T.cam.h-(cur.h ?? T.cam.h))*k;
  camera.position.set(Math.sin(camAngle)*cur.r*.55, cur.h, Math.cos(camAngle)*cur.r*.9 + 2);
  camera.lookAt(0, 1.2, 0);

  // paper stacks shrink with deadline
  stacks.forEach(s=> s.scale.y += ((s.userData.target ?? .5) - s.scale.y)*k);

  // players
  for (const d of desks){
    const idle = Math.sin(t*2 + d.bob)*.03;
    if (d.alive){
      d.worker.position.y = idle;
      d.worker.rotation.z = phase==='NIGHT' ? Math.sin(t*3+d.bob)*.08 : 0;      // sleepy sway at night
      d.scr.material.color.set(cur.mon);
    } else {
      d.dying = Math.min(1, d.dying + dt*1.2);
      d.worker.rotation.x = -d.dying*1.2;                                         // slump forward onto desk
      d.worker.position.y = -d.dying*.35;
      d.scr.material.color.set(0x222222);
    }
  }
  // ghost particles drift up
  const a = pg.attributes.position;
  for (let i=0;i<P;i++){ let y = a.getY(i) + pv[i]*dt; if (y>7) y = 0; a.setY(i, y); a.setX(i, a.getX(i)+Math.sin(t+i)*dt*.2); }
  a.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
cur.r = PRESET.MORNING.cam.r; cur.h = PRESET.MORNING.cam.h;
frame();
</script>
</body>
</html>
