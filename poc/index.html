<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline Necromancer — POC</title>
<style>
:root{
  --bg:#0f0d1a; --panel:#181528; --panel2:#201c36; --line:#33294f; --txt:#ebe7f7; --mut:#9a92b8;
  --light:#f5c451; --dark:#b05cff; --indie:#4ecdc4; --bad:#ff5c7a; --good:#5fe39a;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#2a1f4d,var(--bg));color:var(--txt);
  font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--dark);background:#2a2447}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#b05cff);border:0;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.15)}
.btn.sel{border-color:var(--light);background:#3a3216;box-shadow:0 0 0 1px var(--light) inset}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.light{color:var(--light);border-color:var(--light)} .tag.dark{color:var(--dark);border-color:var(--dark)} .tag.indie{color:var(--indie);border-color:var(--indie)}

/* setup */
.setup{max-width:520px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px}
.setup h1{font-size:28px;margin-bottom:4px}
.setup p{color:var(--mut);margin:4px 0 20px}
.setup label{display:block;margin:14px 0 6px;font-size:13px;color:var(--mut)}
.setup input[type=text],.setup select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:inherit}
.setup .row{display:flex;align-items:center;gap:8px;margin-top:14px}

/* layout */
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:#120f20;position:sticky;top:0;z-index:5}
.top .brand{font-weight:700;letter-spacing:.3px}
.days{display:flex;gap:4px}
.day{padding:3px 9px;border-radius:6px;background:var(--panel2);font-size:12px;color:var(--mut)}
.day.now{background:var(--dark);color:#fff} .day.past{opacity:.5}
.mana{flex:1;max-width:380px}
.mana .bar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.mana .fill{height:100%;background:linear-gradient(90deg,#4f8cff,#9b6bff);transition:width .5s}
.mana small{color:var(--mut);font-size:12px}
.phase{margin-left:auto;font-weight:600;color:var(--light)}
main{display:grid;grid-template-columns:250px 1fr 300px;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{font-size:14px;color:var(--mut);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}

/* players */
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.pl.me{border-color:var(--light)}
.pl.out{opacity:.4;filter:grayscale(.8)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#2f2750;flex:none}
.pl .nm{font-weight:600;font-size:14px}
.pl .sub{font-size:11px;color:var(--mut);display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

/* center */
.center{display:flex;flex-direction:column;gap:16px}
.stage h2{font-size:20px;margin-bottom:6px}
.stage p{color:var(--mut);margin:4px 0 12px}
.report{background:#120f20;border-left:3px solid var(--dark);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.report div{margin:3px 0}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hint{font-size:12px;color:var(--mut)}
.votes{font-size:14px;line-height:1.7}
.chat{height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.msg{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--panel2);max-width:90%}
.msg b{color:var(--light)} .msg.sys{background:transparent;color:var(--mut);font-style:italic;max-width:100%}
.msg.you{align-self:flex-end;background:#2b2150} .msg.anon{border:1px dashed var(--indie)}
.chatbar{display:flex;gap:6px;margin-top:10px}
.chatbar input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:inherit}
.emo{padding:6px 9px}

/* right */
.rolecard img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.rolecard .skill{margin-top:10px;font-size:13px;color:var(--mut)}
.rolecard .skill b{color:var(--txt)}
.intel{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;font-size:13px}
.intel div{background:#120f20;border-left:3px solid var(--indie);padding:6px 10px;border-radius:6px}
.intel small{color:var(--mut)}

/* game over */
.over h2{font-size:26px}
.over.light h2{color:var(--light)} .over.dark h2{color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.grid .rc{background:var(--panel2);border-radius:10px;padding:6px;font-size:12px;border:1px solid var(--line)}
.grid .rc.win{border-color:var(--good);box-shadow:0 0 12px #5fe39a44}
.grid img{width:100%;border-radius:6px;display:block;margin-bottom:4px}
</style>
</head>

  scanner: {n:'Debug Scanner',    d:'ตรวจว่าเมื่อคืนมี Trap ถูกหมอบหรือไม่ และยกเลิกผล Honeypot/Alibi ของคืนที่ผ่านมา (ได้ข้อมูลจริง)'},
  retro:   {n:'Retrospective',    d:'ยกเลิกโทษ Skip ในรอบโหวตวันนี้ (โหวตแบบเปิดชื่ออยู่แล้ว)'},
  freeze:  {n:'Emergency Freeze', d:'คืนนี้ Server Down / Overtime Call ล็อกบาเรียและฮีลไม่ได้'},
};
const EVIMG = '../docs/event_cards/';
const evIs = id => G.event?.id === id;
const evAccepted = id => G.event?.id === id && G.event.accepted === true;
const skillsBanned = () => evAccepted('prod');
const curseBlocked = () => G.day === 1 || G.event?.id === 'watch';
const BOT_NAMES = ['มินท์','บอส','ฟ้า','ต้น','เจ','นุ่น','แบงค์','ปลา'];

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
let G = null, UI = {choice:null, sel:[], side:null, sideSel:[], voteSel:null};

const P = id => G.players[id];
const nm = id => P(id).name;
const alive = () => G.players.filter(p => p.alive);
const er = p => p.role === 'mystery_intern' ? p.copy : p.role;         // effective role
const spec = p => ROLES[er(p)];
const hasSkill = p => { const s = spec(p); return !!s && !(ROLES[p.role].once && p.used) && !p.locked; };

/* =========================================================
   GAME SETUP
   ========================================================= */
function newGame(name, pickRole, god){
  const lights = shuffle(LIGHT).slice(0,5), darks = shuffle(DARK).slice(0,2), indie = shuffle(INDIE).slice(0,1);
  let roles = [...lights, ...darks, ...indie];
  if(pickRole && pickRole !== 'random'){
    if(!roles.includes(pickRole)){
      const same = roles.findIndex(r => ROLES[r].f === ROLES[pickRole].f);
      roles[same] = pickRole;
    }
    roles = [pickRole, ...roles.filter((r,i,arr) => !(r===pickRole && arr.indexOf(r)===i))];
  } else roles = shuffle(roles);
  const names = shuffle(BOT_NAMES);
  G = {
    token: Math.random(), god, day:1, phase:'MORNING',
    players: roles.map((role,i) => ({
      id:i, name: i===0 ? (name||'คุณ') : names[i-1], human:i===0, role, faction:ROLES[role].f,
      alive:true, used:false, copy:null,
      silenced:false, zero:false, dbl:false, silencedNext:false, zeroNext:false, dblNext:false,
      overpromised:false, dodgeUsed:false, plus1Used:false, locked:false, lockedNext:false, votedOut:false, soloWon:false, cause:null, target:null,
    })),
    mana:1, manaMax: Math.floor(roles.length / 2), skipStreak:0, pendingBonus:[], bonusVotes:[],
    trapCharges: roles.length<=8 ? 1 : 2, boosterCharges: 1, boosterPending:true,
    traps:[], fixNotes:[], darkChat:[], cleanSprint:false, retro:false, noPenalty:false, freeze:false, hijackVoter:null, blockIntel:null, trapPlanned:0, lastTrapPlaced:false,
    deck: shuffle(Object.keys(EVENTS)), event:null, night:{}, chat:[], intel:[], report:[], lastVotes:{}, voteResult:null, credit:{}, over:null,
  };
  G.players.forEach(p => G.credit[p.id]=0);
  const rec = G.players.find(p => p.role==='soul_recruiter');
  if(rec) rec.target = rnd(G.players.filter(p => p.id!==rec.id)).id;
  UI = {choice:null, sel:[], side:null, sideSel:[], trapId:null, boosterSel:null, voteSel:null};
  G.report = ['สัปดาห์ใหม่เริ่มแล้ว! Deadline คือวันศุกร์นี้ ปั่นหลอด Mana ให้เต็ม '+G.manaMax+' หน่วย (เริ่มต้นที่ 1 จาก Kickoff)'];
  sys('เข้าสู่ห้องประชุมเช้าวัน'+DAYS[0]);
  startDiscussion();
  render();
}

/* =========================================================
   CHAT / BOTS TALK
   ========================================================= */
function sys(text){ G.chat.push({kind:'sys', text}); }
function say(who, text, kind='bot'){ G.chat.push({kind, who, text}); }

function botLine(b){
  const others = alive().filter(p => p.id !== b.id);
  if(b.faction === 'light'){
    const sus = others.map(p => [p, b.sus?.[p.id] || 0]).sort((a,b)=>b[1]-a[1])[0];
    if(sus && sus[1] >= 3) return `ฉันว่า ${sus[0].name} ดูมีพิรุธนะ ข้อมูลที่ฉันได้มาชี้ไปทางนั้น`;
    return rnd([`เมื่อคืนฉันปั่นงานเต็มที่เลย ใครยังไม่ได้ส่งงานบ้าง?`, `ยังไม่มีข้อมูลชัดเจน ขอ skip ก่อนดีไหม`, `ดู Mana แล้วต้องเร่งมือนะทุกคน`, `ใครมีสกิลสืบช่วยแชร์ข้อมูลหน่อย`]);
  }
  if(b.faction === 'dark'){
    const t = rnd(others.filter(p => p.faction !== 'dark'));
    return rnd([`${t.name} เงียบผิดปกตินะ`, `ฉันว่า ${t.name} น่าสงสัยกว่าใคร`, `เมื่อคืนฉันส่งงานจริง ไม่ได้อู้นะ`, `อย่าเพิ่งโหวตมั่ว เดี๋ยวเสียคนดี`]);
  }
  return rnd([`ฉันก็แค่อยากทำงานให้เสร็จนะ…`, `โหวตฉันก็ได้ ไม่เห็นเป็นไร (ยิ้ม)`, `ใครน่าสงสัยก็บอกมาเลย`]);
}
function startDiscussion(){
  const tk = G.token, bots = shuffle(alive().filter(p => !p.human)).slice(0, evIs('marathon') ? 2 : G.hijackVoter!=null ? 3 : 4);
  bots.forEach((b,i) => setTimeout(() => {
    if(!G || G.token!==tk || G.phase!=='MORNING' || !b.alive) return;
    say(b.name, botLine(b)); render();
  }, 900 + i*1300));
}

/* =========================================================
   VOTING
   ========================================================= */
function botVote(b){
  const others = alive().filter(p => p.id !== b.id);
  if(b.faction === 'light'){
    // ฝ่ายแสงแชร์ข้อมูลกันในห้องประชุม: รวมความสงสัยของบอทฝ่ายแสงทุกคน (สะท้อนการสื่อสารของทีมที่เล่นดี)
    const teamSus = id => G.players.filter(q => q.alive && q.faction==='light' && !q.human).reduce((a,q) => a + (q.sus?.[id]||0), 0);
    const best = others.map(p => [p, teamSus(p.id) + Math.random()*1.5]).sort((x,y)=>y[1]-x[1])[0];
    return best[1] >= 6 ? best[0].id : (Math.random()<.2 ? rnd(others).id : 'SKIP');
  }
  if(b.faction === 'dark'){
    if(G.darkTarget == null || !P(G.darkTarget).alive || G.darkDay !== G.day){
      const lights = others.filter(p => p.faction !== 'dark');
      G.darkTarget = rnd(lights.length ? lights : others).id; G.darkDay = G.day;
    }
    return G.darkTarget === b.id ? 'SKIP' : G.darkTarget;
  }
  if(b.role==='soul_recruiter' && P(b.target).alive && b.target!==b.id) return b.target;
  return Math.random()<.5 ? rnd(others).id : 'SKIP';
}
function submitVote(choice){
  const votes = {};
  alive().forEach(p => {
    if(p.silenced) return;
    let v = p.human ? choice : botVote(p);
    if(p.id === G.hijackVoter) v = 'SKIP';   // Meeting Hijack
    else if(evIs('marathon') && v === 'SKIP' && !p.human){ const o = alive().filter(x => x.id !== p.id); v = rnd(o).id; }   // ประชุมมาราธอน: ห้าม Skip
    votes[p.id] = v;
  });
  const tally = {}; let skip = 0;
  Object.entries(votes).forEach(([vid, t]) => {
    const v = P(+vid), w = (v.zero ? 0 : v.dbl ? 2 : 1) * (v.role==='chaos_intern' && G.day >= 4 ? 2 : 1);   // Chaos Intern x2 วันพฤ–ศุกร์
    if(t === 'SKIP') skip += w; else tally[t] = (tally[t]||0) + w;
  });
  (G.bonusVotes||[]).forEach(b => { if(P(b.to).alive) tally[b.to] = (tally[b.to]||0) + 1; });   // คะแนนแอบยัด +1 (Seeker / Recruiter)
  const bonusUsed = (G.bonusVotes||[]).length; G.bonusVotes = [];
  G.lastVotes = votes;
  const sorted = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  let outcome = null, text;
  if(sorted.length && sorted[0][1] > 0 && (!sorted[1] || sorted[0][1] > sorted[1][1]) && sorted[0][1] > skip){
    outcome = +sorted[0][0];
  }
  // --- Trap triggers ในรอบโหวต
  const trapMsgs = [];
  if(outcome !== null){
    const bl = G.traps.find(t => t.kind==='blame' && t.day === G.day-1);
    if(bl && P(outcome).faction === 'dark'){ outcome = null; G.traps = G.traps.filter(t => t !== bl); trapMsgs.push('🪤 Trap Card ทำงาน: Blame Shifting — ยกเลิกการไล่ออก ผลโหวตกลายเป็น Skip'); }
  }
  if(outcome !== null){
    const ex = G.traps.find(t => t.kind==='exit' && t.day === G.day-1 && t.target === outcome);
    if(ex){
      G.traps = G.traps.filter(t => t !== ex);
      G.mana = Math.max(0, G.mana - 1);
      const lights = alive().filter(p => p.faction==='light' && p.id !== outcome);
      if(lights.length) G.blockIntel = rnd(lights).id;
      trapMsgs.push('🪤 Trap Card ทำงาน: Exit Scam — Mana −1 และแจ้งเตือนลับของฝ่ายแสง 1 คนจะถูกบล็อกพรุ่งนี้เช้า');
    }
  }
  const lines = alive().map(p => p.silenced ? `${p.name}: 🤐 ถูกปิดปาก โหวตไม่ได้` : `${p.name} → ${votes[p.id]==='SKIP' ? 'Skip' : nm(votes[p.id])}${p.zero?' (พลังโหวต 0)':p.dbl?' (x2)':(p.role==='chaos_intern'&&G.day>=4?' (x2)':'')}`);
  if(bonusUsed) lines.push(`🎯 มีคะแนนโหวตลับ +1 จากสกิล ${bonusUsed} คะแนนถูกนับรวม`);
  if(outcome === null){
    // Guard: ประชุมเปล่า = เสียเวลา → Mana ปั่นงานคืนนี้ลดลง (1 รอบ: ได้ 0, ติดกัน 2 รอบขึ้นไป: −1)
    if(G.retro){ G.noPenalty = true; text = 'คะแนนเสมอหรือ Skip ชนะ — ไม่มีใครถูกไล่ออก (Retrospective: ยกเลิกโทษ Skip รอบนี้)'; }
    else {
      G.skipStreak = (G.skipStreak||0) + 1;
      text = `คะแนนเสมอหรือ Skip ชนะ — ไม่มีใครถูกไล่ออก ⏳ ประชุมเสียเวลา คืนนี้ Mana ปั่นงานได้ ${1-Math.min(G.skipStreak,2)} แทน +1 (Skip ติดกัน ${G.skipStreak} รอบ)`;
    }
  }
  else {
    G.skipStreak = 0;
    const t = P(outcome);
    t.alive = false;
    if(t.role === 'severance_seeker'){
      t.soloWon = true; t.cause = 'seeker';
      text = `${t.name} ถูกโหวตไล่ออก... และเผยว่าเป็น Severance Seeker! คว้าเงินชดเชยแล้วชิ่งออกจากเกม (ชนะส่วนตัว)`;
    } else {
      t.votedOut = true; t.cause = 'fired';
      text = `${t.name} ถูกไล่ออก! บทบาทคือ ${ROLES[t.role].n} (${FNAME[t.faction]})`;
      if(t.faction === 'dark'){ G.mana = Math.min(G.manaMax, G.mana + 2); G.cleanSprint = true; text += ' — กำจัดตัวถ่วงสำเร็จ Mana +2! (Clean Sprint: คืนนี้สายสืบเจาะ Honeypot Bug ได้)'; }
    }
  }
  if(trapMsgs.length) text += ' · ' + trapMsgs.join(' · ');
  G.traps = G.traps.filter(t => t.day >= G.day);   // Trap แบบรอข้ามวันหมดอายุหลังรอบโหวต
  G.voteResult = {lines, text};
  G.phase = 'VOTE_RESULT';
  sys('ผลโหวต: ' + text);
  checkEnd();
  render();
}

/* =========================================================
   NIGHT: BOT ACTIONS + RESOLVE
   ========================================================= */
function candidates(p){
  const s = spec(p); if(!s) return [];
  return alive().filter(x => {
    if(s.pool === 'any') return true;
    if(x.id === p.id) return false;
    if(s.pool === 'nondark') return x.faction !== 'dark';
    return true;
  });
}
function botNight(p){
  const pickT = n => shuffle(candidates(p)).slice(0,n).map(x => x.id);
  const out = {type:'REST', targets:[]};
  const snackRest = evIs('snack') && Math.random() < .35;
  if(hasSkill(p) && !skillsBanned() && !snackRest){
    const once = ROLES[p.role].once;            // สกิลครั้งเดียว: เก็บไว้ใช้จังหวะเหมาะ
    if(!once || (G.day >= 2 && Math.random() < .3)){ out.type = 'SKILL'; out.targets = pickT(Math.max(spec(p).t,0)); }
  }
  if(p.role === 'soul_recruiter' && out.type === 'SKILL' && !p.plus1Used && Math.random() < .3) out.plus1 = true;
  if(p.faction === 'dark'){
    const r = Math.random(), lights = alive().filter(x => x.faction!=='dark');
    out.side = 'FAKE'; out.sideTargets = [];
    if(r < .4) out.side = 'SABOTAGE';
    else if(r < .65 && !curseBlocked() && lights.length){ out.side = 'CURSE'; out.sideTargets = [rnd(lights).id]; }
    if(G.trapCharges - (G.trapPlanned||0) > 0 && Math.random() < .22){
      const kind = rnd(Object.keys(TRAPS)), need = TRAPS[kind].need;
      const pool = need==='dark' ? alive().filter(x => x.faction==='dark') : need==='nondark' ? alive().filter(x => x.faction!=='dark') : alive();
      if(!need || pool.length){ out.side = 'TRAP'; out.trapId = kind; out.sideTargets = need ? [rnd(pool).id] : []; G.trapPlanned++; }
    }
  }
  return out;
}

function setCopies(){
  const al = alive();
  G.players.forEach(p => {
    if(p.role !== 'mystery_intern' || !p.alive) return;
    p.copy = null;
    for(let i=1;i<G.players.length;i++){
      const q = G.players[(p.id+i) % G.players.length];
      if(q.alive && q.faction==='light' && !ROLES[q.role].once){ p.copy = q.role; p.copyFrom = q.name; break; }
    }
  });
}

function resolveNight(){
  const notes = {}, add = (pid, text, sus) => (notes[pid] = notes[pid] || []).push({text, sus});
  const rep = [];
  const A = [];
  alive().forEach(p => { const n = G.night[p.id] || {type:'REST',targets:[]};
    A.push({p, type:n.type, targets:n.targets||[], plus1:n.plus1});
    if(n.side) A.push({p, type:n.side, targets:n.sideTargets||[], side:true, trapId:n.trapId}); });
  const act = pid => A.find(a => a.p.id === pid && !a.side);
  const skillOf = (a, role) => a.type === 'SKILL' && er(a.p) === role && a.targets !== undefined;
  const skills = role => A.filter(a => skillOf(a, role));
  A.forEach(a => { if(a.type==='SKILL' && ROLES[a.p.role].once) a.p.used = true; });

  // Trap Card: หมอบตามโควตาส่วนกลาง (เกินโควตา = กลายเป็นส่งงานหลอก)
  G.fixNotes = []; let placedNow = 0;
  A.filter(a => a.side && a.type === 'TRAP').forEach(a => {
    if(G.trapCharges > 0 && a.trapId){
      G.trapCharges--; placedNow++;
      G.traps.push({kind:a.trapId, target:a.targets[0], day:G.day, fresh:true, triggered:false});
      add(a.p.id, `หมอบ Trap Card: ${TRAPS[a.trapId].n}${a.targets[0]!=null?' ที่ '+nm(a.targets[0]):''} (โควตา Trap เหลือ ${G.trapCharges})`);
    } else { a.type = 'FAKE'; add(a.p.id, 'โควตา Trap หมดแล้ว — กลายเป็นส่งงานหลอก'); }
  });
  G.lastTrapPlaced = placedNow > 0;
  const honeyOn = tid => !G.cleanSprint && G.traps.find(t => t.kind==='honeypot' && t.target===tid && t.fresh);
  const alibiOn = pid => G.traps.find(t => t.kind==='alibi' && t.target===pid && t.fresh);
  // Prod Crisis (รับ): ทุกคนห้ามใช้สกิลคืนนี้
  if(skillsBanned()) A.forEach(a => { if(a.type === 'SKILL'){ a.type = 'REST'; a.targets = []; } });
  // Hot Desking: สุ่มสลับเป้าหมายสกิล 1 คู่แบบลับๆ (เฉลยเช้าถัดไป)
  if(evIs('hotdesk')){
    const base = A.filter(a => !a.side), withT = base.filter(a => a.type==='SKILL' && a.targets.length);
    const pool = withT.length >= 2 ? withT : base;
    if(pool.length >= 2){
      const [x, y] = shuffle(pool).slice(0, 2);
      [x.targets, y.targets] = [y.targets, x.targets];
      rep.push(`🪑 Hot Desking เฉลย: ระบบสลับเป้าหมายสกิลของ ${x.p.name} กับ ${y.p.name} เมื่อคืน${withT.length>=2?'':' (ไม่ค่อยมีผล)'}`);
    }
  }
  // 1. Scope Creep — สลับเป้าหมาย
  skills('chaos_scrum').forEach(sc => {
    if(sc.targets.length !== 2) return;
    const x = act(sc.targets[0]), y = act(sc.targets[1]);
    if(x && y){ [x.targets, y.targets] = [y.targets||[], x.targets||[]]; add(sc.p.id, `Scope Creep: สลับเป้าหมายของ ${nm(x.p.id)} กับ ${nm(y.p.id)} แล้ว`); }
  });
  // 2. Deploy on Friday / Rollback flags
  const evId = G.event?.id, evYes = G.event?.accepted === true;
  const lockProtect = (evId==='down' || (evId==='ot' && evYes)) && !G.freeze;   // Emergency Freeze กันการล็อกจากการ์ด
  const devops = skills('chaos_devops').length > 0 || lockProtect;
  const chrono = skills('chrono_tech_lead').length > 0;
  if(skills('chaos_devops').length) rep.push('⚠️ ระบบ Deploy ตอนเย็นวันศุกร์ — ระบบป้องกันล่มทั้งหมดเมื่อคืนนี้');

  // 3. Shield / Heal / Trap
  const shield = {}, heal = {};
  if(!devops){
    skills('oracle_pm').forEach(a => { if(a.targets[0]!=null) shield[a.targets[0]] = a.p.id; });
    skills('coffee_admin').forEach(a => { if(a.targets[0]!=null) heal[a.targets[0]] = a.p.id; });
  }
  skills('coffee_admin').forEach(a => { if(a.targets[0]!=null && P(a.targets[0]).alive){ P(a.targets[0]).dblNext = true; add(a.p.id, `Espresso Elixir: ${nm(a.targets[0])} จะมีพลังโหวต x2 เช้าถัดไป`); }});

  const curseT = A.filter(a => a.type==='CURSE' && a.targets[0]!=null).map(a => a.targets[0]);
  const immune = {};   // Espresso: ถ้าเป้าหมายไม่โดนสาป Burnout → กัน NDA Silence / PIP Curse
  skills('coffee_admin').forEach(a => { const t = a.targets[0]; if(t!=null && (t in heal) && !curseT.includes(t)){ immune[t] = true; add(a.p.id, `Espresso Elixir: ${nm(t)} ไม่โดนสาป Burnout จึงได้ภูมิคุ้มกัน NDA Silence/PIP Curse คืนนี้`); } });

  // Production Crisis (รับ): ฝ่ายแสง 1 คนแบบสุ่มได้คุ้มกันจากคำสาป Burnout คืนนี้
  let prodShield = null;
  if(evId==='prod' && evYes){ const ls = alive().filter(p => p.faction==='light'); if(ls.length){ prodShield = rnd(ls).id; add(prodShield, '🛡️ Production Crisis: คุณได้รับคุ้มกันจากคำสาป Burnout คืนนี้ (สุ่ม)'); rep.push('🛡️ Production Crisis: ฝ่ายแสง 1 คน (สุ่ม) ได้รับคุ้มกันจากคำสาป Burnout คืนนี้'); } }
  // 4. Curse / Sabotage
  const deaths = []; let blocked = 0;
  if(!chrono){
    A.filter(a => a.type==='CURSE' && a.targets[0]!=null && !curseBlocked()).forEach(c => {
      const t = P(c.targets[0]);
      if(!t.alive) return;
      // คำสาปที่ไม่ได้ผลทุกสาเหตุให้ผลเหมือนกัน (ฝ่ายมืดแยกไม่ได้ว่าเป็น Freelancer หรือถูกป้องกัน)
      const guarded = (t.id in shield) || (t.id in heal) || t.id === prodShield || (evIs('snack') && act(t.id)?.type === 'REST');
      const dodged = !guarded && t.faction === 'indie' && !t.dodgeUsed;
      if(guarded || dodged){ if(dodged){ t.dodgeUsed = true; add(t.id, '🛡️ Freelance Dodge: เกราะของคุณรับคำสาป Burnout ไว้ — เกราะถูกทำลายแล้ว (ครั้งต่อไปจะไม่รอด)'); } blocked++; add(c.p.id, `คำสาปใส่ ${t.name} ไม่ทำงาน (ถูกสกัด — ไม่ทราบสาเหตุ)`); return; }
      if(!deaths.includes(t.id)) deaths.push(t.id);
    });
    // Production Crisis (ปฏิเสธ): คำสาป Burnout แบบสุ่ม 1 คน
    if(evId==='prod' && G.event.accepted === false){
      const pool = alive().filter(p => p.faction !== 'dark');   // ไม่รวมฝ่ายมืด
      const t = pool.length ? rnd(pool) : null;
      rep.push('🎲 Production Crisis (ปฏิเสธ): คำสาป Burnout แบบสุ่มถูกปล่อยออกมา!');
      if(!t){ }
      else if((t.id in shield) || (t.id in heal) || (evIs('snack') && act(t.id)?.type === 'REST')) blocked++;
      else if(t.faction === 'indie' && !t.dodgeUsed){ t.dodgeUsed = true; blocked++; add(t.id, '🛡️ Freelance Dodge: เกราะของคุณรับคำสาป Burnout ไว้ — เกราะถูกทำลายแล้ว (ครั้งต่อไปจะไม่รอด) (คำสาปสุ่มจาก Production Crisis)'); }
      else if(!deaths.includes(t.id)) deaths.push(t.id);
    }
  } else rep.push('⏪ Hotfix Rollback: คำสาปและบั๊กทั้งหมดของเมื่อคืนถูกยกเลิก');
  if(blocked) rep.push(`🛡️ มีคำสาป Burnout ถูกสกัดไว้ ${blocked} ครั้ง`);

  // Stand-up Shield กันผิดคน (เป้าหมายเป็นฝ่ายมืด): บาเรียแตก PM ใช้สกิลคืนถัดไปไม่ได้ + เตือนออร่ามืด (Alibi Mirror กันได้)
  Object.entries(shield).forEach(([tid, pmId]) => {
    const t = P(+tid); if(t.faction !== 'dark') return;
    const al = alibiOn(t.id);
    if(al){ al.triggered = true; return; }
    P(pmId).lockedNext = true;
    add(pmId, `Stand-up Shield: เป้าหมาย ${t.name} มีออร่ามืด! 😈 บาเรียแตก — คุณใช้สกิลคืนถัดไปไม่ได้`, [{pid:t.id, val:6}]);
  });
  // sales / hr / legal
  skills('illusionist_sales').forEach(a => { if(a.targets[0]!=null){ P(a.targets[0]).overpromised = true; add(a.p.id, `Overpromise: Log ของ ${nm(a.targets[0])} คืนนี้ดูเหมือนวางบั๊ก`); }});
  skills('shadow_hr').forEach(a => { if(a.targets[0]!=null){ const t=P(a.targets[0]); if(immune[t.id]){ add(a.p.id, `PIP Curse: ${t.name} ดูเหมือนมีภูมิคุ้มกัน (ถูกต้านทาน)`); return; } t.zeroNext = true; add(a.p.id, `PIP Curse: ${t.name} เป็น ${ROLES[t.role].n} (${FNAME[t.faction]}) — พลังโหวตพรุ่งนี้เป็น 0`); }});
  skills('shadow_legal').forEach(a => { if(a.targets[0]!=null){ const t=P(a.targets[0]); if(immune[t.id]){ add(a.p.id, `NDA Silence: ${t.name} ดูเหมือนมีภูมิคุ้มกัน (ถูกต้านทาน)`); return; } t.silencedNext = true; add(a.p.id, `NDA Silence: ปิดปาก ${t.name} แล้ว`); }});

  // 5. Mana + credit
  const lightsAlive = A.filter(a => !a.side && a.p.faction==='light');
  let passive = 1 - (G.noPenalty ? 0 : Math.min(G.skipStreak||0, 2));
  if(evId==='restart') passive = Math.min(passive, 0);
  if(evId==='scope' && evYes) passive += 1;
  if(evId==='bonus' && evYes) passive += 1;
  const bugCap = evId==='scope' && evYes ? 2 : 1;
  const insurance = G.traps.find(t => t.kind==='insurance' && t.fresh);
  if(chrono && insurance) insurance.triggered = true;
  const bugCount = (chrono && !insurance) ? 0 : A.filter(a => a.type === 'SABOTAGE').length;
  const bugs = evId==='bonus' && evYes ? (bugCount ? 2 : 0) : Math.min(bugCap, bugCount);   // บั๊กซ้อนกันหักได้สูงสุด −1/คืน
  const before = G.mana;
  G.mana = Math.max(0, Math.min(G.manaMax, G.mana + passive - bugs));
  rep.push(`📊 Mana Task ${G.mana >= before ? '+' : ''}${G.mana - before} (ตอนนี้ ${G.mana}/${G.manaMax}) — ปั่นงานปกติ ${passive>=0?'+':''}${passive}${passive<1?' (ประชุมเสียเวลา)':''}${bugs?`, บั๊ก −${bugs}`:''}`);

  // intel
  const shown = a => {
    const p = a.p;
    if(p.overpromised || (er(p)==='severance_seeker' && a.type==='SKILL')) return 'bug';
    if(p.faction==='light') return 'work';
    const side = A.find(x => x.side && x.p===p);
    return side?.type==='SABOTAGE' ? 'bug' : side?.type==='FAKE' ? 'work' : 'none';
  };
  const blackout = evId === 'blackout';
  const intelSkills = role => {
    if(!blackout) return skills(role);
    skills(role).forEach(a => add(a.p.id, `${spec(a.p).skill}: ไฟดับ/เน็ตหลุด ไม่ได้ข้อมูลเลย 🔌`));
    return [];
  };
  const sLabel = x => x==='work' ? 'ส่งงานจริง ✅' : x==='bug' ? 'แอบวางบั๊ก 🐛' : 'ไม่ได้ส่งงานเมื่อคืน';
  intelSkills('senior_dev').forEach(a => {
    const tids = [a.targets[0]];
    if(evId === 'audit'){ const extra = alive().filter(x => x.id!==a.p.id && x.id!==a.targets[0]); if(extra.length) tids.push(rnd(extra).id); }
    tids.forEach(tid => {
      const t = act(tid); if(!t) return;
      const truth = shown(t); let sh = truth;
      const al = alibiOn(tid), hp = honeyOn(tid);
      if(al && t.p.faction==='dark'){ sh = 'work'; al.triggered = true; }
      if(hp){ sh = truth === 'bug' ? 'work' : 'bug'; hp.triggered = true; }
      const mk = x => ({text:`Code Review${tid!==a.targets[0]?' (ลูกค้าตรวจเพิ่ม)':''}: ${t.p.name} → ${sLabel(x)}`, sus:[{pid:t.p.id, val: x==='bug'?6 : x==='work'?-2 : 1}]});
      const f = mk(sh); add(a.p.id, f.text, f.sus);
      if(sh !== truth){ const tt = mk(truth); G.fixNotes.push({pid:a.p.id, text:'(Debug Scanner แก้ข้อมูล) ' + tt.text, sus:tt.sus}); }
    });
  });
  intelSkills('qa_hunter').forEach(a => {
    if(a.targets.length<2) return;
    const truth = a.targets.some(id => P(id).faction === 'dark');
    let hit = a.targets.some(id => P(id).faction === 'dark' && !alibiOn(id));
    a.targets.forEach(id => { const al = alibiOn(id); if(al && P(id).faction==='dark') al.triggered = true; });
    const hp = a.targets.map(honeyOn).find(Boolean); if(hp){ hit = !hit; hp.triggered = true; }
    const mk = h => ({text:`Bug Bounties: ใน ${a.targets.map(nm).join(' และ ')} ${h?'มีฝ่ายมืดอย่างน้อย 1 คน 😈':'ไม่มีฝ่ายมืดเลย ✅'}`, sus:a.targets.map(id => ({pid:id, val: h?3:-3}))});
    const f = mk(hit); add(a.p.id, f.text, f.sus);
    if(hit !== truth){ const tt = mk(truth); G.fixNotes.push({pid:a.p.id, text:'(Debug Scanner แก้ข้อมูล) ' + tt.text, sus:tt.sus}); }
  });
  intelSkills('data_oracle').forEach(a => add(a.p.id, `KPI Forecast: งานเสร็จจริง ${lightsAlive.length} ชิ้น vs บั๊กแฝง ${A.filter(x=>x.type==='SABOTAGE').length} ชิ้น`));
  intelSkills('rune_ux').forEach(a => {
    const tid = a.targets[0]; if(tid==null) return;
    const all = A.filter(x => x.p.id!==a.p.id && (x.type==='SKILL'||x.type==='CURSE') && x.targets?.includes(tid)).map(x => x.p);
    const hp = honeyOn(tid); if(hp) hp.triggered = true;
    const who = (hp ? all.filter(p => p.faction !== 'dark') : all).map(p => p.name);
    const mk = list => ({text:`Wireframe Trap: คนที่ใช้สกิลใส่ ${nm(tid)} เมื่อคืน → ${list.length ? list.join(', ') : 'ไม่มีใครเลย'}`, sus:list.map(n => ({pid:G.players.find(q=>q.name===n).id, val:2}))});
    const f = mk(who); add(a.p.id, f.text, f.sus);
    if(hp && who.length !== all.length){ const tt = mk(all.map(p => p.name)); G.fixNotes.push({pid:a.p.id, text:'(Debug Scanner แก้ข้อมูล) ' + tt.text, sus:tt.sus}); }
  });
  // Glory Thief: ขโมยแจ้งเตือน + Credit (ดักก่อนส่งผลสืบ) — เป้าหมายต้องเป็นฝ่ายแสงที่ใช้สกิลคืนนี้
  skills('glory_thief').forEach(a => {
    const tid = a.targets[0]; if(tid == null) return;
    const ta = act(tid);
    if(ta && ta.type === 'SKILL' && ta.p.faction === 'light' && !skillsBanned()){
      G.credit[a.p.id]++;
      const stolen = notes[tid] || []; delete notes[tid];
      add(a.p.id, `Take Credit: ${nm(tid)} ใช้สกิลสำเร็จ — คุณได้ +1 Credit (รวม ${G.credit[a.p.id]}/2)${stolen.length ? ' และขโมยแจ้งเตือน: ' + stolen.map(x => x.text).join(' | ') : ''}`);
      stolen.forEach(x => (notes[a.p.id] = notes[a.p.id] || []).push({text:'(ขโมยมา) ' + x.text, sus:x.sus}));
    } else add(a.p.id, `Take Credit: ${nm(tid)} ไม่ได้ใช้สกิลสำเร็จคืนนี้ (หรือไม่ใช่ฝ่ายแสง) — ไม่ได้ Credit`);
  });
  skills('soul_recruiter').forEach(a => {
    const tid = a.p.target;
    if(a.plus1 && !a.p.plus1Used){
      a.p.plus1Used = true; G.pendingBonus.push({to:tid});
      add(a.p.id, `Poach Offer: แอบยัดคะแนนโหวต +1 ใส่ ${nm(tid)} ในวันพรุ่งนี้ (ใช้สิทธิ์ 1 ครั้ง/เกมแล้ว)`);
    } else {
      const v = Object.entries(G.lastVotes).filter(([,t]) => t===tid).map(([v]) => nm(+v));
      add(a.p.id, `Poach Offer: เป้าหมายของคุณคือ ${nm(tid)} — โหวตรอบล่าสุดโดน: ${v.length ? v.join(', ') : 'ยังไม่มีใครโหวต'}`);
    }
  });
  skills('severance_seeker').forEach(a => { G.pendingBonus.push({to:a.p.id}); add(a.p.id, 'Fake Bug Trace: ทิ้งรอยบั๊กปลอมใน Log ของคุณแล้ว และแอบเพิ่มคะแนนโหวต +1 ใส่ตัวเองในวันพรุ่งนี้'); });

  // Chaos Intern: Reply All (ท้ายสุด เพื่อให้เห็นแจ้งเตือนครบ)
  const publicBroadcast = [];
  skills('chaos_intern').forEach(a => {
    const victims = shuffle(Object.keys(notes).map(Number).filter(id => id !== a.p.id && notes[id].length));
    if(victims.length) publicBroadcast.push(`📢 [Reply All] ${notes[victims[0]][0].text}`);
    else publicBroadcast.push('📢 [Reply All] ไม่มีแจ้งเตือนให้ป่าวประกาศเลย');
  });

  // Trap ที่ทำงานคืนนี้ → ประกาศบนหน้าจอกลาง (ไม่ระบุชื่อคนวาง) แล้วหมดอายุ
  G.traps.filter(t => t.fresh && t.triggered).forEach(t => rep.push(`🪤 Trap Card ทำงาน: ${TRAPS[t.kind].n}`));
  G.traps = G.traps.filter(t => !['honeypot','alibi','insurance'].includes(t.kind));
  G.traps.forEach(t => t.fresh = false);

  // deaths
  deaths.forEach(id => { const t = P(id); t.alive = false; t.cause = 'burnout'; });
  if(deaths.length) rep.unshift('💀 ' + deaths.map(id => nm(id)).join(', ') + ' ติดสถานะ Burnout! (บทบาทไม่ถูกเปิดเผยจนจบเกม)');
  else rep.unshift(G.day===1 ? 'คืนแรกผ่านไปอย่างสงบ (Grace Period)' : '😮‍💨 เมื่อคืนไม่มีใคร Burnout');

  // Soul Recruiter: เป้าหมายตายกลางคืน → สุ่มเป้าหมายใหม่ทันที
  G.players.filter(p => p.role==='soul_recruiter' && p.alive && !P(p.target).alive && !P(p.target).votedOut).forEach(p => {
    const pool = alive().filter(x => x.id !== p.id);
    if(pool.length){ p.target = rnd(pool).id; add(p.id, `เป้าหมายเดิมออกจากเกมแล้ว — เป้าหมายลับใหม่ของคุณคือ ${nm(p.target)}`); }
  });
  // deliver notes
  G.players.forEach(p => {
    (notes[p.id]||[]).forEach(n => {
      if(G.blockIntel === p.id) return;   // Exit Scam บล็อกแจ้งเตือนลับ
      if(p.human) G.intel.push({day:G.day, text:n.text});
      else (n.sus||[]).forEach(s => { p.sus = p.sus || {}; p.sus[s.pid] = (p.sus[s.pid]||0) + s.val; });
    });
  });
  // (บอทที่ถูกปิดปาก/ถูกสาปจะยังไม่รู้ — ไม่ต้องจำลองเพิ่ม)
  G.report = rep;
  publicBroadcast.forEach(t => say('ไม่ระบุชื่อ', t.replace('📢 [Reply All] ',''), 'anon'));
  rep.forEach(r => sys(r));
  G.blockIntel = null;
  G.players.forEach(p => p.overpromised = false);
}

function startNight(choice){
  setCopies();
  G.night = {}; G.trapPlanned = 0;
  alive().forEach(p => { G.night[p.id] = p.human ? choice : botNight(p); if(G.night[p.id].side === 'TRAP') G.trapPlanned++; });
  resolveNight();
  G.cleanSprint = G.freeze = G.retro = G.noPenalty = false;
  if(checkEnd()) { render(); return; }
  if(G.day >= 5){ endGame('timeout'); render(); return; }
  G.day++;
  G.bonusVotes = G.pendingBonus; G.pendingBonus = [];
  alive().forEach(p => { p.locked = p.lockedNext; p.lockedNext = false; });
  alive().forEach(p => { p.silenced = p.silencedNext; p.zero = p.zeroNext; p.dbl = p.dblNext; p.silencedNext = p.zeroNext = p.dblNext = false; });
  G.players.filter(p => !p.alive).forEach(p => p.silenced = p.zero = p.dbl = false);
  const sil = alive().filter(p => p.silenced).map(p => p.name);
  if(sil.length){ G.report.push('🤐 NDA Silence: ' + sil.join(', ') + ' ถูกปิดปาก (พิมพ์แชทและโหวตไม่ได้วันนี้)'); }
  G.phase = 'MORNING'; UI = {choice:null, sel:[], side:null, sideSel:[], voteSel:null};
  sys('— เช้าวัน' + DAYS[G.day-1] + ' —');
  G.boosterPending = G.boosterCharges > 0; UI.boosterSel = null; G.darkChat = [];
  G.hijackVoter = null;
  const hj = G.traps.find(t => t.kind === 'hijack' && t.day === G.day - 1);
  if(hj){
    const pool = alive().filter(p => !p.silenced);
    if(pool.length) G.hijackVoter = rnd(pool).id;
    G.traps = G.traps.filter(t => t !== hj);
    const m = '🪤 Trap Card ทำงาน: Meeting Hijack — เวลาคุยลด 30% และมีผู้เล่น 1 คนถูกบังคับให้ Skip';
    G.report.push(m); sys(m);
    if(G.hijackVoter === 0) G.report.push('🎤 ไมค์ของคุณถูกยึด — วันนี้คุณถูกบังคับให้โหวต Skip');
  }
  drawEvent();
  if(!P(0).alive && G.boosterPending) resolveBooster(null);
  if(checkEnd()){ render(); return; }
  startDiscussion();
  render();
}

function resolveBooster(humanChoice){
  if(!G.boosterPending) return;
  G.boosterPending = false;
  const keys = Object.keys(BOOSTERS), tally = {NONE:0};
  keys.forEach(k => tally[k] = 0);
  alive().forEach(p => {
    let v;
    if(p.human) v = humanChoice || 'NONE';
    else if(p.faction === 'dark') v = 'NONE';                                   // ฝ่ายมืดไม่อยากให้ฝ่ายแสงได้ Booster
    else v = boosterWant(p) || 'NONE';                                          // ฝ่ายแสงบอทโหวตตามสถานการณ์จริง (ประหยัดโควตา)
    tally[v]++;
  });
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const win = top[0], tie = top[1] && top[1][1] === win[1];
  if(win[0] === 'NONE' || tie){ const m = `🚀 โหวต Sprint Booster: ไม่เปิดใช้ (${keys.map(k => BOOSTERS[k].n + ' ' + tally[k]).join(' / ')} / ไม่เปิด ${tally.NONE})`; sys(m); return; }
  const id = win[0]; G.boosterCharges--;
  let m = `🚀 Sprint Booster เปิดใช้: ${BOOSTERS[id].n} (เหลือโควตา ${G.boosterCharges})`;
  if(id === 'scanner'){
    m += ` — เมื่อคืน${G.lastTrapPlaced ? 'มี' : 'ไม่มี'} Trap Card ถูกหมอบ`;
    G.fixNotes.forEach(f => { const p = P(f.pid); if(p.human) G.intel.push({day:G.day, text:f.text}); else (f.sus||[]).forEach(x => { p.sus = p.sus||{}; p.sus[x.pid] = (p.sus[x.pid]||0) + x.val*1.2; }); });
    G.fixNotes = [];
  }
  if(id === 'retro') G.retro = true;
  if(id === 'freeze') G.freeze = true;
  sys(m); G.report.push(m);
}
// Booster คือ power-up ของฝ่ายแสง: ใช้เมื่อสถานการณ์คุ้มเท่านั้น (ข้อมูลสาธารณะ + ร่องรอยข้อมูลปลอมที่ตัวเองสงสัย)
function boosterWant(p){
  const lockEv = evIs('down') || (evIs('ot') && G.event.accepted !== false);
  if(lockEv) return 'freeze';
  if((G.skipStreak||0) >= 1) return 'retro';
  if(G.fixNotes.length && Math.random() < .6) return 'scanner';
  if(G.lastTrapPlaced && Math.random() < .4) return 'scanner';
  return null;
}
function boosterHint(){
  const h = [];
  if(evIs('down') || (evIs('ot') && G.event.accepted !== false)) h.push('Emergency Freeze (วันนี้การ์ดจะล็อกบาเรีย/ฮีล)');
  if((G.skipStreak||0) >= 1) h.push(`Retrospective (Skip ติดกัน ${G.skipStreak} รอบ โทษกำลังบั่นทอน Mana)`);
  return h.length ? `<div class="hint">💡 สถานการณ์วันนี้เข้าทาง: ${h.join(' · ')}</div>` : '';
}
function pickBooster(b){ UI.boosterSel = b; render(); }

function drawEvent(){
  G.event = null;
  if(G.day < 2 || !G.deck.length) return;
  const id = G.deck.pop(), e = EVENTS[id];
  G.event = {id, accepted:null, pending:!!e.choice};
  sys('📞 Client Event: ' + e.t + ' — ' + e.d);
  if(e.now) G.mana = Math.max(0, Math.min(G.manaMax, G.mana + e.now));
  if(id === 'leak') replyAllLeak();
  if(e.choice && !P(0).alive) resolveChoice(null);
}
function replyAllLeak(){
  const key = p => { const n = G.night[p.id]; return n ? n.type + '/' + (n.side || '') : null; };
  const pool = alive().filter(p => key(p));
  if(pool.length < 2) return;
  const [a, b] = shuffle(pool).slice(0, 2);
  const same = key(a) === key(b);
  const msg = `📧 Reply-All Leak: เมื่อคืน ${a.name} กับ ${b.name} ทำแอ็กชัน${same ? '"เหมือนกัน"' : '"ต่างกัน"'}`;
  sys(msg); G.report.push(msg);
}
function resolveChoice(humanYes){
  const ev = G.event, id = ev.id, e = EVENTS[id];
  let yes = 0, no = 0;
  alive().forEach(p => {
    const v = p.human ? humanYes : (p.faction==='dark' ? true : Math.random() < .5);   // ฝ่ายมืดโหวตรับทุกใบ (ความเสี่ยงสูงฝั่งแสง)
    if(v) yes++; else no++;
  });
  ev.accepted = yes > no; ev.pending = false;
  if(ev.accepted && id==='ot') G.mana = Math.min(G.manaMax, G.mana + 1);
  if(id==='prod' && !ev.accepted) G.mana = Math.max(0, G.mana - 2);   // รับ = +0, ปฏิเสธ = −2 + คำสาปสุ่มคืนนี้
  const msg = `ทีมโหวต ${e.yes} ${yes} / ${e.no} ${no} → ${ev.accepted ? e.yes : e.no}`;
  sys('📞 ' + msg);
  G.report.push('📞 ' + e.t + ': ' + msg);
  checkEnd();
}
function answerEvent(yes){ resolveChoice(yes); render(); }

/* =========================================================
   WIN CHECK
   ========================================================= */
function checkEnd(){
  const L = alive().filter(p => p.faction==='light').length, D = alive().filter(p => p.faction==='dark').length;
  if(G.mana >= G.manaMax) return endGame('light', 'Mana Task เต็ม 100% — ส่งงานทัน Deadline!');
  if(D === 0) return endGame('light', 'ไล่ฝ่ายมืดออกจากบริษัทจนหมดแล้ว!');
  if(D >= L) return endGame('dark', 'ฝ่ายมืดมีจำนวนมากกว่าหรือเท่ากับฝ่ายแสงแล้ว — บริษัทล่มสลาย');
  return false;
}
function endGame(side, why){
  if(side === 'timeout') why = 'หมดวันศุกร์แล้ว โปรเจกต์ยังไม่เสร็จ — ลัทธิอู้งานยื้อสำเร็จ';
  const winners = G.players.filter(p => {
    if(p.faction==='light') return side==='light';
    if(p.faction==='dark') return side==='dark' || side==='timeout';
    if(p.role==='severance_seeker') return p.soloWon;
    if(p.role==='soul_recruiter') return P(p.target).votedOut;
    if(p.role==='glory_thief') return side==='light' && p.alive && G.credit[p.id] >= 2;
    if(p.role==='chaos_intern') return side==='timeout' && p.alive;
    return false;
  }).map(p => p.id);
  G.over = {side: side==='timeout' ? 'dark' : side, why, winners};
  G.phase = 'OVER';
  return true;
}

function toVote(){ if(G.event?.pending) return; resolveBooster(UI.boosterSel || 'NONE'); G.phase='VOTE'; UI.voteSel=null; render(); }
function toNight(){
  G.phase='NIGHT'; UI={choice:null, sel:[], side:null, sideSel:[], trapId:null, voteSel:null}; setCopies();
  G.darkChat = [];
  if(P(0).faction==='dark' && P(0).alive){
    const lights = alive().filter(p => p.faction!=='dark');
    G.players.filter(p => p.faction==='dark' && !p.human && p.alive).forEach(b => {
      const t = lights.length ? rnd(lights).name : '…';
      G.darkChat.push({who:b.name, text: rnd([`คืนนี้สาป ${t} ดีไหม?`, `ฉันว่าวางบั๊กก่อน Mana จะได้ไม่ขึ้นเร็ว`, `มี Trap เหลือ ${G.trapCharges} ใบ ใครอยากหมอบบ้าง?`, `ระวัง ${t} น่าจะเป็นสายสืบ`]) });
    });
  }
  render(); if(!P(0).alive) startNight({type:'REST',targets:[]}); }
function pickVote(v){ UI.voteSel = v; render(); }
function confirmVote(){ submitVote(P(0).silenced || G.hijackVoter===0 ? 'SKIP' : UI.voteSel); }
function skipDead(){ if(G.phase==='MORNING') toVote(); else if(G.phase==='VOTE') submitVote('SKIP'); }
function chooseAction(t){ UI.choice = t; UI.sel = []; render(); }
function chooseMode(b){ UI.plus1 = b; render(); }
function chooseSide(t){ UI.side = t; UI.sideSel = []; UI.trapId = null; render(); }
function chooseTrap(k){ UI.trapId = k; UI.sideSel = []; render(); }
function toggleT(id){
  const need = needTargets(), i = UI.sel.indexOf(id);
  if(i>=0) UI.sel.splice(i,1); else { if(UI.sel.length>=need) UI.sel.shift(); UI.sel.push(id); }
  render();
}
function toggleS(id){ UI.sideSel = [id]; render(); }
function needTargets(){ const me = P(0); return UI.choice === 'SKILL' ? Math.max(spec(me)?.t || 0, 0) : 0; }
function confirmNight(){
  const me = P(0), n = {type:UI.choice, targets:UI.sel.slice(), plus1: !!UI.plus1};
  if(me.faction === 'dark'){ n.side = UI.side; n.sideTargets = (UI.side==='CURSE' || UI.side==='TRAP') ? UI.sideSel.slice() : []; if(UI.side==='TRAP') n.trapId = UI.trapId; }
  startNight(n);
}
function sendDark(e){ e.preventDefault(); const i = $('#darkIn'); const t = i.value.trim(); if(!t) return; G.darkChat.push({who:P(0).name, text:t}); i.value=''; render(); }
function sendChat(e){
  e.preventDefault();
  const inp = $('#chatIn'); const t = inp.value.trim(); if(!t) return;
  if(P(0).silenced) return;
  say(P(0).name, t, 'you'); inp.value=''; render();
}
function emoji(e){ say(P(0).name, e, 'you'); render(); }
function restart(){ G=null; render(); }

function darkChatHTML(me){
  if(me.faction !== 'dark') return '';
  return `<div class="report" style="border-color:var(--dark);margin-top:14px"><b>🕯️ ห้องแชทลับฝ่ายมืด</b>${G.darkChat.map(m => `<div><b>${esc(m.who)}:</b> ${esc(m.text)}</div>`).join('') || '<div class="hint">ยังไม่มีใครพูด</div>'}
    <form class="chatbar" onsubmit="sendDark(event)"><input id="darkIn" placeholder="นัดแนะแผนกับเพื่อนร่วมลัทธิ…" autocomplete="off"><button class="btn emo" type="submit">ส่ง</button></form></div>`;
}
function boosterHTML(me){
  if(!G.boosterPending || !me.alive) return G.boosterCharges > 0 ? '' : '';
  const opts = Object.entries(BOOSTERS).map(([k,b]) => `<button class="btn ${UI.boosterSel===k?'sel':''}" title="${esc(b.d)}" onclick="pickBooster('${k}')">${b.n}</button>`).join('');
  return `<div class="report" style="border-color:var(--indie)"><div><b>🚀 Sprint Booster (โหวตสาธารณะ — เหลือโควตา ${G.boosterCharges})</b></div>
    <div class="hint">ทุกคนโหวตแบบไม่เปิดเผยฝั่ง เสียงข้างมากชนะ เสมอ = ไม่เปิดใช้ (ไม่เลือกอะไร = ไม่เปิด)</div>
    ${boosterHint()}
    <div class="acts">${opts}<button class="btn ${!UI.boosterSel||UI.boosterSel==='NONE'?'sel':''}" onclick="pickBooster('NONE')">ไม่เปิดใช้</button></div>
    ${UI.boosterSel && BOOSTERS[UI.boosterSel] ? `<div class="hint">${esc(BOOSTERS[UI.boosterSel].d)}</div>` : ''}</div>`;
}
function chatHTML(){
  const me = P(0);
  const msgs = G.chat.slice(-60).map(m => m.kind==='sys' ? `<div class="msg sys">${esc(m.text)}</div>`
    : `<div class="msg ${m.kind}"><b>${esc(m.who)}:</b> ${esc(m.text)}</div>`).join('');
  const canChat = G.phase==='MORNING' && me.alive;
  return `<div class="card"><h3>แชทกลาง</h3><div class="chat">${msgs}</div>
    ${canChat ? `<form class="chatbar" onsubmit="sendChat(event)">
      <input id="chatIn" placeholder="${me.silenced?'🤐 ถูกปิดปาก — ส่งได้แค่อีโมจิ':'พิมพ์ข้อความ…'}" ${me.silenced?'disabled':''} autocomplete="off">
      ${['👍','🤔','😡','😂','🙏'].map(e => `<button type="button" class="btn emo" onclick="emoji('${e}')">${e}</button>`).join('')}
    </form>` : ''}</div>`;
}

function sideHTML(){
  const me = P(0), r = ROLES[me.role];
  const goal = me.faction==='light' ? 'ปั่น Mana ให้เต็ม หรือไล่ฝ่ายมืดให้หมด'
             : me.faction==='dark' ? 'ยื้อถึงวันศุกร์ หรือให้ฝ่ายมืด ≥ ฝ่ายแสง' : r.win;
  const mates = me.faction==='dark' ? `<p class="hint">เพื่อนร่วมลัทธิ: ${G.players.filter(p=>p.faction==='dark'&&p.id!==0).map(p=>esc(p.name)).join(', ')||'—'}</p>` : '';
  const credit = me.role==='glory_thief' ? `<p class="hint">⭐ Credit: <b>${G.credit[0]}/2</b></p>` : '';
  const dodge = me.faction==='indie' ? `<p class="hint">🛡️ Freelance Dodge: ${me.dodgeUsed?'ใช้ไปแล้ว':'ยังเหลือ 1 ครั้ง (รับคำสาป Burnout ได้ 1 ครั้ง · เมื่อทำงานระบบจะแจ้งคุณว่าเกราะถูกทำลาย)'}</p>` : '';
  const target = me.role==='soul_recruiter' ? `<p class="hint">🎯 เป้าหมายลับ: <b>${esc(nm(me.target))}</b></p>` : '';
  return `<aside class="center">
    <div class="card rolecard"><h3>บทบาทของคุณ</h3>
      <img src="${IMG+r.img}" alt="${r.n}">
      <div class="skill"><span class="tag ${me.faction}">${FNAME[me.faction]}</span><br><b>${r.n}</b> ${r.sub}<br><b>สกิล:</b> ${r.skill}<br>${esc(r.d)}<br><b>เป้าหมาย:</b> ${esc(goal)}</div>${mates}${target}${credit}${dodge}</div>
    <div class="card"><h3>ข้อมูลลับของคุณ</h3><div class="intel">${G.intel.length ? G.intel.slice().reverse().map(i => `<div><small>วัน${DAYS[i.day-1]}</small><br>${esc(i.text)}</div>`).join('') : '<span class="hint">ยังไม่มีข้อมูลลับ</span>'}</div></div>
  </aside>`;
}

render();
</script>
</body>
</html>
