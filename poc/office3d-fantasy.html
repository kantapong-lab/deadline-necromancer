<meta charset="utf-8">

<title>Deadline Necromancer — Arcane Agency (fantasy 3D)</title>
<style>
  :root{--bg:#0f0d1a;--panel:#181528;--panel2:#201c36;--line:#33294f;--txt:#ebe7f7;--mut:#9a92b8;
        --light:#f5c451;--dark:#b05cff;--indie:#4ecdc4;--bad:#ff5c7a;--good:#5fe39a;
        --team:#4fd0ff;--cult:#ff4d5e;--seek:#4ee07a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;cursor:pointer}
  .top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:20px;padding:10px 20px;background:#120f20d9;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);z-index:5}
  .brand{font-weight:700;letter-spacing:.3px}
  .days{display:flex;gap:4px}
  .day{padding:3px 9px;border-radius:6px;background:var(--panel2);font-size:12px;color:var(--mut)}
  .day.now{background:var(--dark);color:#fff} .day.past{opacity:.5}
  .mana{flex:1;max-width:380px}
  .mana .bar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .mana .fill{height:100%;background:linear-gradient(90deg,#4f8cff,#9b6bff);transition:width .5s}
  .mana small{color:var(--mut);font-size:12px}
  .phase{margin-left:auto;font-weight:600;color:var(--light)}
  .bar2{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px);z-index:5}
  .btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;transition:.15s}
  .btn:hover{border-color:var(--dark);background:#2a2447}
  .btn.on{background:linear-gradient(135deg,#7c3aed,#b05cff);border:0;font-weight:600}
  .sep{width:1px;background:var(--line);margin:0 4px}
  #flash{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .6s}
  #msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:4}
  .tag{position:fixed;left:0;top:0;pointer-events:none;background:#181528e6;border:1px solid var(--line);color:#fff;font-weight:600;font-size:13px;padding:2px 10px;border-radius:99px;white-space:nowrap;z-index:3}
  .tag.light{border-color:var(--team);color:var(--team)} .tag.dark{border-color:var(--cult);color:var(--cult)} .tag.indie{border-color:var(--seek);color:var(--seek)}
  .tag.out{border-color:#555;color:#999;text-decoration:line-through}
  .legend{position:fixed;left:16px;top:58px;font-size:12px;color:var(--mut);z-index:4;display:none;background:#120f20d9;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="brand">🧙 Deadline Necromancer</div>
  <div class="days" id="days"></div>
  <div class="mana"><div class="bar"><div class="fill" id="fill"></div></div><small id="manaTxt"></small></div>
  <div class="phase" id="phase">ประชุมเช้า</div>
</div>
<div class="legend" id="legend"><div><i style="background:#4fd0ff"></i>Team Deliver (ฝ่ายแสง)</div><div><i style="background:#ff4d5e"></i>Cult of Burnout (ฝ่ายมืด)</div><div><i style="background:#4ee07a"></i>Severance Seekers (ฝ่ายอิสระ)</div></div>
<div id="msg"></div><div id="flash"></div>
<div class="bar2">
  <button class="btn on" data-p="MORNING">☀ ประชุมเช้า</button>
  <button class="btn" data-p="VOTE">🗳 โหวต</button>
  <button class="btn" data-p="NIGHT">🌙 กลางคืน</button>
  <span class="sep"></span>
  <button class="btn" id="fire">📨 ไล่ออก (ซองขาว)</button>
  <button class="btn" id="burn">🔥 Burnout</button>
  <button class="btn" id="trap">🪤 Trap</button>
  <button class="btn" id="mp">Mana +1</button>

  <span class="sep"></span>
  <button class="btn" id="secret">👁 มุมมอง Moderator: ปิด</button>

  <button class="btn" id="next">⏭ วันถัดไป</button>
  <button class="btn" id="focus">🔍 ดูตัวละคร</button>
  <button class="btn" id="orbit">🎥 กล้องหมุน</button>
</div>

  for (const c of fx) { c.t += dt; const u = Math.min(1, c.t/1.2); c.card.position.y = 1.2 + u*1.5 + Math.sin(t*1.5)*.04; c.card.scale.setScalar(.2 + u*.8); c.card.rotation.y = (1 - u)*Math.PI*2 + Math.sin(t*.8)*.1; }
  const a = pg.attributes.position; for (let i = 0; i < P; i++) { let y = a.getY(i) + pv[i]*dt; if (y > 7) y = 0; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(t + i)*dt*.2); } a.needsUpdate = true;
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
