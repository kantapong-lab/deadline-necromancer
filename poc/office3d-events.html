<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadline Necromancer — Arcane Agency (paper-doll cards)</title>
<style>
  :root{--bg:#0f0d1a;--panel:#181528;--panel2:#201c36;--line:#33294f;--txt:#ebe7f7;--mut:#9a92b8;
        --light:#f5c451;--dark:#b05cff;--indie:#4ecdc4;--bad:#ff5c7a;--good:#5fe39a;
        --team:#4fd0ff;--cult:#ff4d5e;--seek:#4ee07a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;cursor:pointer}
  .top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:20px;padding:10px 20px;background:#120f20d9;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);z-index:5}
  .brand{font-weight:700;letter-spacing:.3px}
  .days{display:flex;gap:4px}
  .day{padding:3px 9px;border-radius:6px;background:var(--panel2);font-size:12px;color:var(--mut)}
  .day.now{background:var(--dark);color:#fff} .day.past{opacity:.5}
  .mana{flex:1;max-width:380px}
  .mana .bar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .mana .fill{height:100%;background:linear-gradient(90deg,#4f8cff,#9b6bff);transition:width .5s}
  .mana small{color:var(--mut);font-size:12px}
  .phase{margin-left:auto;font-weight:600;color:var(--light)}
  .bar2{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px);z-index:5}
  .btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;transition:.15s}
  .btn:hover{border-color:var(--dark);background:#2a2447}
  .btn.on{background:linear-gradient(135deg,#7c3aed,#b05cff);border:0;font-weight:600}
  .sep{width:1px;background:var(--line);margin:0 4px}
  #flash{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .6s}
  #msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:4}
  .tag{position:fixed;left:0;top:0;pointer-events:none;background:#181528e6;border:1px solid var(--line);color:#fff;font-weight:600;font-size:13px;padding:2px 10px;border-radius:99px;white-space:nowrap;z-index:3}
  .tag.light{border-color:var(--team);color:var(--team)} .tag.dark{border-color:var(--cult);color:var(--cult)} .tag.indie{border-color:var(--seek);color:var(--seek)}
  .tag.out{border-color:#555;color:#999;text-decoration:line-through}
  #cap{position:fixed;left:50%;top:60px;transform:translateX(-50%) translateY(-8px);width:min(560px,calc(100% - 32px));background:#120f20eb;border:1px solid var(--line);border-radius:14px;padding:10px 16px;z-index:6;opacity:0;pointer-events:none;transition:.35s;white-space:pre-line}
  #cap.show{opacity:1;transform:translateX(-50%)}
  #cap b{display:block;font-size:16px;margin-bottom:3px;color:var(--light)} #cap div{font-size:13px;color:var(--txt)}
  #cap.trap b{color:var(--cult)} #cap.boost b{color:var(--light)} #cap.evt b{color:var(--team)}
  #chips{position:fixed;right:14px;top:60px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:5;max-width:360px}
  .chip{background:#120f20e6;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;animation:pop .4s}
  .chip.evt{border-color:var(--team);color:var(--team)} .chip.trap{border-color:var(--cult);color:var(--cult)} .chip.boost{border-color:var(--light);color:var(--light)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .bub{position:fixed;left:0;top:0;pointer-events:none;z-index:4;font-weight:800;font-size:14px;padding:2px 9px;border-radius:99px;border:2px solid;background:#120f20e6;white-space:nowrap}
  .bub.y{border-color:var(--good);color:var(--good)} .bub.n{border-color:var(--bad);color:var(--bad)}
  .legend{position:fixed;left:16px;top:58px;font-size:12px;color:var(--mut);z-index:4;display:none;background:#120f20d9;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
<script src="../app/src/shared/data.js"></script>
<script type="importmap">

<canvas id="c"></canvas>

  <div class="brand">🧙 Deadline Necromancer</div>

  <div class="mana"><div class="bar"><div class="fill" id="fill"></div></div><small id="manaTxt"></small></div>
  <div class="phase" id="phase">ประชุมเช้า</div>

  <button class="btn" data-p="NIGHT">🌙 กลางคืน</button>

  <button class="btn" id="burn">🔥 Burnout</button>
  <button class="btn" id="evt">🎴 Event Card</button>

  <button class="btn" id="ttrig">⚡ Trap ทำงาน</button>
  <button class="btn" id="boost">🚀 Sprint Booster</button>
  <button class="btn" id="mp">Mana +1</button>

  <span class="sep"></span>
  <button class="btn" id="secret">👁 มุมมอง Moderator: ปิด</button>
  <button class="btn" id="reroll">🎲 สุ่มบทบาทใหม่</button>
  <button class="btn" id="next">⏭ วันถัดไป</button>
  <button class="btn" id="focus">🔍 ดูตัวละคร</button>
  <button class="btn" id="orbit">🎥 กล้องหมุน</button>
</div>

      x.fillStyle = '#ffffffaa'; for (let i = 0; i < 9; i++) { const cx = rnd()*w, cy = 60 + rnd()*150; for (let k = 0; k < 4; k++) { x.beginPath(); x.ellipse(cx + k*34, cy + (k % 2)*8, 60, 20, 0, 0, 7); x.fill(); } }

    fpos.set(fw.x + dir.x*3.1, 1.75, fw.z + dir.z*3.1); focusLook.set(fw.x, 1.25, fw.z);
    camera.position.lerp(fpos, 1 - Math.pow(.003, dt)); flook.lerp(focusLook, 1 - Math.pow(.003, dt)); camera.lookAt(flook);
  } else if (manual) {
    controls.update(); flook.copy(controls.target);
  } else {
    camera.position.set(Math.sin(camAngle)*cur.r*.55, cur.h, Math.cos(camAngle)*cur.r*.9 + 2); camera.lookAt(cur.tgt.x, cur.tgt.y + (phase === 'VOTE' ? .4 : 1.5), cur.tgt.z); flook.set(cur.tgt.x, cur.tgt.y + 1.5, cur.tgt.z);
  }

  for (const d of desks) {
    d.t += dt;
    const showAura = secrets && d.state !== 'fired' && false;
    d.worker.getWorldPosition(fw2); let loc = Math.atan2(camera.position.x - fw2.x, camera.position.z - fw2.z) - d.g.rotation.y; loc = Math.atan2(Math.sin(loc), Math.cos(loc));
    const faceUp = d.state === 'fired' || (secrets && d.state === 'alive') || focus === d.i;       // flip card to show the role art
    d.flip += ((faceUp ? 0 : 1) - d.flip)*(1 - Math.pow(.0015, dt)); d.pivot.rotation.y = d.flip*Math.PI;
    if (d.state === 'alive') {
      d.worker.rotation.y += (THREE.MathUtils.clamp(loc, -.9, .9) - d.worker.rotation.y)*(1 - Math.pow(.02, dt));
      d.pivot.position.y = .15 + CARD_H/2 + .06 + Math.sin(t*1.8 + d.bob)*.04 + Math.sin(d.flip*Math.PI)*.18;             // hover + lift while flipping
      d.pivot.rotation.z = Math.sin(t*1.1 + d.bob)*.02 + (phase === 'NIGHT' ? Math.sin(t*3 + d.bob)*.03 : 0);
      d.hm.color.copy(cur.mon); d.ring.material.opacity += ((showAura ? .7 : 0) - d.ring.material.opacity)*k; d.halo.material.opacity += ((faceUp ? .35 : 0) - d.halo.material.opacity)*k;
    } else if (d.state === 'burnout') {
      const u = Math.min(1, d.t*1.2); d.worker.rotation.x = u*1.35; d.worker.position.y = u*.1; tint(d, u);
      d.smoke.forEach(sm => { const p = (sm.p + d.t*.25) % 1; sm.s.position.set(0, .8 + p*1.6, .5); sm.s.scale.setScalar(.5 + p*1.6); sm.s.material.opacity = .32*(1 - p); });
      d.ring.material.opacity += ((showAura ? .7 : 0) - d.ring.material.opacity)*k; d.halo.material.opacity = 0;
    } else if (d.state === 'fired') {
      d.worker.rotation.y += (THREE.MathUtils.clamp(loc, -.9, .9) - d.worker.rotation.y)*(1 - Math.pow(.02, dt));
      d.pivot.position.y = .15 + CARD_H/2 + .12 + Math.sin(t*1.8 + d.bob)*.05; d.halo.material.opacity = .55 + Math.sin(t*3)*.15; d.ring.material.opacity = 0;
      d.hm.color.set(0x222222);
      const e = Math.min(1, d.t/1.4); d.env.position.y = 4 - e*3.0 + (e < 1 ? Math.sin(t*5)*.05 : 0); d.env.rotation.y = (1 - e)*Math.PI*3 + .3; d.env.rotation.x = (1 - e)*.6;
    }
    if (showAura) d.ring.rotation.z += dt;
    d.hf.forEach(b => b.material.emissive.copy(d.state === 'alive' ? cur.mon : tmpC.set(d.state === 'burnout' ? 0xff5c7a : 0x222222)));
    d.holo.position.y = 2.1 + Math.sin(t*1.2 + d.bob)*.05; d.anim(t, d.bob);
    d.anchor.getWorldPosition(v); v.project(camera);
    d.el.style.display = v.z < 1 ? '' : 'none';
    d.el.style.transform = `translate(${(v.x*.5 + .5)*innerWidth}px,${(-v.y*.5 + .5)*innerHeight}px) translate(-50%,-50%)`;
  }
  for (const c of fx) { c.t += dt; const u = Math.min(1, c.t/1.2); c.card.position.y = 1.2 + u*1.5 + Math.sin(t*1.5)*.04; c.card.scale.setScalar(.2 + u*.8); c.card.rotation.y = (1 - u)*Math.PI*2 + Math.sin(t*.8)*.1; }
  const a = pg.attributes.position; for (let i = 0; i < P; i++) { let y = a.getY(i) + pv[i]*dt; if (y > 7) y = 0; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(t + i)*dt*.2); } a.needsUpdate = true;
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
