<html lang="th">
<head>
<meta charset="utf-8">

<title>Deadline Necromancer — Fantasy Desk Options</title>
<style>
  html,body{margin:0;height:100%;background:#0f0d1a;overflow:hidden;color:#ebe7f7;font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .lab{position:fixed;left:0;top:0;pointer-events:none;text-align:center;width:210px;margin-left:-105px;background:#181528e6;border:1px solid #33294f;border-radius:12px;padding:8px 10px;font-size:12px;color:#9a92b8}
  .lab b{display:block;color:#f5c451;font-size:14px;margin-bottom:2px}
  .hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#120f20d9;border:1px solid #33294f;border-radius:10px;padding:6px 14px;font-size:12px;color:#9a92b8}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">ลากเมาส์ = หมุน · ล้อเมาส์ = ซูม · คลิกขวาลาก = เลื่อน — ตัวเลือก 1–5 เรียงจากซ้ายไปขวา</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('c'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0818); scene.fog = new THREE.Fog(0x0b0818, 18, 44);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 80); camera.position.set(0, 3.4, 9.6);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .55, .5, .9); composer.addPass(bloom); composer.addPass(new OutputPass());
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1.4, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*.49; controls.minDistance = 3; controls.maxDistance = 26;

// ---------- helpers ----------
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color:c, roughness:.75, metalness:.05, ...o });
const gold = () => std(0xd8b050, { roughness:.3, metalness:.85 });
const emi = (c, i = 2, o = {}) => new THREE.MeshStandardMaterial({ color:0x000000, emissive:c, emissiveIntensity:i, toneMapped:false, ...o });
const add = (p, g, m, x = 0, y = 0, z = 0, sh = true) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = sh; o.receiveShadow = true; p.add(o); return o; };
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d), cyl = (a, b, h, s = 20) => new THREE.CylinderGeometry(a, b, h, s);
const sph = (r, a = 20, b = 14) => new THREE.SphereGeometry(r, a, b), tor = (R, r, arc = Math.PI*2) => new THREE.TorusGeometry(R, r, 8, 32, arc), cone = (r, h, s = 10) => new THREE.ConeGeometry(r, h, s);
function tex(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const rnd = (() => { let s = 5; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const RUNES = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
const glowTex = tex(64, 64, x => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(1, '#fff0'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
const runePanel = (col) => tex(256, 256, (x, w, h) => { x.fillStyle = '#0000'; x.clearRect(0, 0, w, h); x.strokeStyle = x.fillStyle = col; x.lineWidth = 4; x.beginPath(); x.arc(128, 128, 118, 0, 7); x.stroke(); x.beginPath(); x.arc(128, 128, 96, 0, 7); x.stroke();
  x.font = '30px "Segoe UI Historic","Segoe UI Symbol",serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; for (let i = 0; i < 14; i++) { const a = i/14*6.283; x.save(); x.translate(128 + Math.cos(a)*107, 128 + Math.sin(a)*107); x.rotate(a + 1.57); x.fillText(RUNES[i], 0, 0); x.restore(); }
  x.lineWidth = 3; x.beginPath(); for (let i = 0; i <= 5; i++) { const a = (i*2/5)*6.283 - 1.57; i ? x.lineTo(128 + Math.cos(a)*84, 128 + Math.sin(a)*84) : x.moveTo(128 + Math.cos(a)*84, 128 + Math.sin(a)*84); } x.stroke(); });
const flames = [], anim = [];
const flame = (p, x, y, z, c = 0xffb050, s = 1) => { const f = add(p, cone(.05*s, .13*s, 8), emi(c, 3), x, y, z, false); flames.push(f); return f; };

// ---------- environment ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), std(0x1d1833, { roughness:.55, metalness:.2 })); floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.HemisphereLight(0xa898ee, 0x3a2a60, 1.6));
const key = new THREE.DirectionalLight(0xffe2c0, 2.2); key.position.set(-5, 10, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left:-14, right:14, top:8, bottom:-8 }); key.shadow.bias = -.0006; scene.add(key);
const back = new THREE.Mesh(new THREE.PlaneGeometry(60, 12), std(0x1a1430)); back.position.set(0, 6, -4); scene.add(back);
const labels = [];
const SP = 3.9;
function station(i, title, desc) {
  const g = new THREE.Group(); g.position.x = (i - 2)*SP; scene.add(g);
  add(g, new THREE.CylinderGeometry(1.75, 1.85, .08, 40), std(0x2a2147, { metalness:.4, roughness:.4 }), 0, .04, 0, false);
  const el = document.createElement('div'); el.className = 'lab'; el.innerHTML = `<b>${i + 1}. ${title}</b>${desc}`; document.body.appendChild(el);
  const anchor = new THREE.Object3D(); anchor.position.set(0, 3.3, 0); g.add(anchor); labels.push({ el, anchor });
  return g;
}

// ===== 1. Scrying Altar — stone slab + crystal ball =====
{
  const g = station(0, 'แท่นพยากรณ์ (Scrying Altar)', 'แผ่นหินสลักรูน ลูกแก้ววิเศษแทนจอ เห็นกลุ่มควันหมุนข้างใน');
  const st = std(0x4a4260, { roughness:.9 });
  add(g, box(2, .18, .95), st, 0, .98, 0); add(g, box(2.08, .04, 1.03), gold(), 0, 1.1, 0, false);
  for (const sx of [-.8, .8]) { add(g, cyl(.2, .26, .9, 8), st, sx, .5, 0); add(g, cyl(.27, .27, .08, 8), gold(), sx, .95, 0); }
  add(g, box(1.4, .4, .06), emi(0xb05cff, .5), 0, .5, .34, false);                       // rune inlay on front
  const stand = add(g, cyl(.2, .3, .1, 12), gold(), 0, 1.17, -.05); for (let k = 0; k < 3; k++) { const a = k*2.09; add(g, cone(.05, .2, 6), gold(), Math.cos(a)*.17, 1.24, -.05 + Math.sin(a)*.17); }
  const ball = add(g, sph(.34, 28, 20), new THREE.MeshPhysicalMaterial({ color:0x9fd0ff, transparent:true, opacity:.25, roughness:.05, metalness:0, transmission:.4, thickness:.3 }), 0, 1.58, -.05, false);
  const swirl = add(g, sph(.25, 20, 14), new THREE.MeshBasicMaterial({ map:tex(128, 128, (x, w, h) => { const gr = x.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(.4, '#7fe3ff'); gr.addColorStop(1, '#6a35b8'); x.fillStyle = gr; x.fillRect(0, 0, w, h); x.strokeStyle = '#ffffffaa'; x.lineWidth = 3; for (let k = 0; k < 6; k++) { x.beginPath(); x.arc(64 + Math.cos(k)*18, 64 + Math.sin(k)*18, 14 + k*7, k, k + 2.2); x.stroke(); } }), toneMapped:false }), 0, 1.58, -.05, false);
  const r1 = add(g, tor(.5, .014), emi(0xf5c451, 2), 0, 1.58, -.05, false), r2 = add(g, tor(.62, .01), emi(0xb05cff, 2), 0, 1.58, -.05, false);
  const pl = new THREE.PointLight(0x7fe3ff, 1.5, 3); pl.position.set(0, 1.7, .1); g.add(pl);
  for (const sx of [-.7, .7]) { add(g, cyl(.04, .04, .22, 8), std(0xf0e8d8), sx, 1.2, .25); flame(g, sx, 1.36, .25); }
  anim.push(t => { swirl.rotation.y = t*.7; swirl.rotation.x = Math.sin(t*.4)*.5; r1.rotation.set(t*.6, t*.3, 0); r2.rotation.set(-t*.4, 0, t*.5); ball.position.y = swirl.position.y = r1.position.y = r2.position.y = 1.58 + Math.sin(t*1.3)*.03; });
}
// ===== 2. Alchemist's Bench =====
{
  const g = station(1, 'โต๊ะนักเล่นแร่แปรธาตุ', 'ม้านั่งไม้ ขวดยา หม้อต้มฟองฟู่ ม้วนสูตรลอยแทนจอ');
  const w = std(0x5a3e28, { roughness:.6 });
  add(g, box(2, .14, .95), w, 0, .95, 0); for (const sx of [-.9, .9]) add(g, box(.12, .9, .8), w, sx, .45, 0); add(g, box(1.7, .06, .7), w, 0, .35, 0);
  add(g, box(2, 1.2, .1), w, 0, 1.6, -.5);                                              // shelf wall
  for (const y of [1.3, 1.75]) { add(g, box(2, .05, .26), w, 0, y, -.4); for (let k = 0; k < 6; k++) add(g, cyl(.05, .07, .22, 10), emi([0xff4fa0, 0x4fd0ff, 0x7dff9a, 0xb05cff, 0xffb050, 0x4fd0ff][k], 1.4, { transparent:true, opacity:.9 }), -.8 + k*.32, y + .14, -.4, false); }
  const cz = add(g, sph(.3, 22, 14), std(0x23232b, { metalness:.8, roughness:.35 }), -.5, 1.12, .05); cz.scale.y = .8;
  const liq = add(g, new THREE.CircleGeometry(.24, 22), emi(0x7dff9a, 2.2), -.5, 1.28, .05, false); liq.rotation.x = -Math.PI/2;
  add(g, tor(.27, .03), std(0x23232b, { metalness:.8 }), -.5, 1.27, .05).rotation.x = Math.PI/2;
  const bubbles = []; for (let k = 0; k < 6; k++) { const b = add(g, sph(.04), emi(0x7dff9a, 2), -.5, 1.3, .05, false); bubbles.push(b); }
  add(g, cyl(.1, .13, .1, 14), std(0x8a8a96, { metalness:.5 }), .3, 1.07, .25); add(g, cyl(.02, .025, .26, 8), std(0xcfcfd6), .33, 1.2, .25).rotation.z = .5;   // mortar & pestle
  add(g, sph(.1, 14, 10), emi(0xff4fa0, 1.6, { transparent:true, opacity:.85 }), .65, 1.12, .2, false); add(g, cyl(.025, .03, .12, 8), std(0x3a2a1a), .65, 1.25, .2, false);
  const scroll = add(g, new THREE.PlaneGeometry(.9, .6), new THREE.MeshBasicMaterial({ map:tex(256, 170, (x, w2, h) => { x.fillStyle = '#e8d8a8'; x.fillRect(0, 0, w2, h); x.strokeStyle = '#6a4a28'; x.lineWidth = 3; x.strokeRect(6, 6, w2 - 12, h - 12); x.fillStyle = '#6a4a28'; x.font = '22px serif'; for (let k = 0; k < 5; k++) x.fillText(RUNES.slice(k*4, k*4 + 14), 18, 38 + k*24); x.strokeStyle = '#b05cff'; x.beginPath(); x.arc(200, 90, 28, 0, 7); x.stroke(); }), side:THREE.DoubleSide, transparent:true, opacity:.95 }), .45, 1.95, .15, false);
  add(g, tor(.5, .008), emi(0xffe28a, 1.5), .45, 1.95, .15, false).rotation.x = Math.PI/2;
  anim.push(t => { bubbles.forEach((b, k) => { const p = (t*.5 + k/6) % 1; b.position.set(-.5 + Math.sin(t*3 + k)*.1, 1.3 + p*.5, .05 + Math.cos(t*2 + k)*.08); b.scale.setScalar(1 - p*.6); }); scroll.position.y = 1.95 + Math.sin(t*1.2)*.05; scroll.rotation.y = Math.sin(t*.6)*.25; });
}
// ===== 3. Grimoire Lectern =====
{
  const g = station(2, 'แท่นอ่านคัมภีร์ (Grimoire Lectern)', 'แท่นเอียงแกะสลัก คัมภีร์เปิดลอยเรืองแสง หน้ากระดาษปลิวรอบๆ');
  const w = std(0x3a2418, { roughness:.55 });
  add(g, cyl(.35, .5, .15, 10), gold(), 0, .08, 0); add(g, cyl(.18, .24, .85, 10), w, 0, .55, 0); add(g, cyl(.3, .22, .12, 10), gold(), 0, .98, 0);
  const slope = add(g, box(1.7, .1, .9), w, 0, 1.12, 0); slope.rotation.x = -.35; add(g, box(1.74, .04, .06), gold(), 0, 1.0, .42, false);
  for (const sx of [-1, 1]) { add(g, cyl(.05, .05, .24, 8), std(0xf0e8d8), sx*.95, 1.15, .15); flame(g, sx*.95, 1.32, .15); add(g, cyl(.08, .08, .03, 10), gold(), sx*.95, 1.02, .15, false); }
  const book = new THREE.Group(); book.position.set(0, 1.75, -.05); g.add(book);
  const pageT = tex(256, 340, (x, w2, h) => { const gr = x.createLinearGradient(0, 0, w2, 0); gr.addColorStop(0, '#fff6d8'); gr.addColorStop(1, '#ffe9a8'); x.fillStyle = gr; x.fillRect(0, 0, w2, h); x.fillStyle = '#7a4aff'; x.font = '24px "Segoe UI Historic","Segoe UI Symbol",serif'; for (let k = 0; k < 11; k++) x.fillText(RUNES.slice(k % 6, k % 6 + 9), 22, 40 + k*28); x.strokeStyle = '#7a4aff'; x.lineWidth = 3; x.strokeRect(8, 8, w2 - 16, h - 16); });
  const pm = new THREE.MeshBasicMaterial({ map:pageT, side:THREE.DoubleSide, toneMapped:false });
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(.55, .75), pm), pr = pl.clone(); pl.position.x = -.29; pr.position.x = .29; pl.rotation.y = .3; pr.rotation.y = -.3; book.add(pl, pr);
  add(book, box(1.28, .06, .8), std(0x5a1a2a), 0, -.4, 0).rotation.x = -.4; add(book, box(.06, .8, .06), gold(), 0, 0, .0, false).rotation.x = 0;
  const glowP = add(book, new THREE.PlaneGeometry(1.8, 1.4), new THREE.MeshBasicMaterial({ map:glowTex, color:0x9b6bff, transparent:true, opacity:.5, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }), 0, 0, -.1, false);
  const flying = []; for (let k = 0; k < 4; k++) { const p = new THREE.Mesh(new THREE.PlaneGeometry(.3, .4), pm); g.add(p); flying.push(p); }
  const pt = new THREE.PointLight(0x9b6bff, 1.8, 4); pt.position.set(0, 1.9, .3); g.add(pt);
  anim.push(t => { book.position.y = 1.75 + Math.sin(t*1.1)*.05; pl.rotation.y = .3 + Math.sin(t*1.5)*.08; pr.rotation.y = -.3 - Math.sin(t*1.5)*.08;
    flying.forEach((p, k) => { const a = t*.6 + k*1.57; p.position.set(Math.cos(a)*1.1, 1.8 + Math.sin(t + k)*.25, Math.sin(a)*.7); p.rotation.set(Math.sin(t*2 + k)*.6, -a, Math.cos(t*1.5 + k)*.5); }); });
}
// ===== 4. Levitating Rune Slab =====
{
  const g = station(3, 'แผ่นหินลอย (Levitating Rune Slab)', 'โต๊ะลอยเหนือวงรูน ไม่มีขา คริสตัลโคจร แผงรูนลอยแทนจอ');
  const st = std(0x2a2440, { roughness:.5, metalness:.3 });
  const disc = add(g, new THREE.CircleGeometry(1.2, 40), new THREE.MeshBasicMaterial({ map:runePanel('#b05cff'), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }), 0, .1, 0, false); disc.rotation.x = -Math.PI/2;
  const beam = add(g, cyl(.9, 1.0, .9, 28, 1), new THREE.MeshBasicMaterial({ color:0xb05cff, transparent:true, opacity:.12, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, toneMapped:false }), 0, .55, 0, false);
  const slab = new THREE.Group(); slab.position.y = 1.0; g.add(slab);
  add(slab, box(2, .2, .95), st); add(slab, box(2.06, .04, 1.01), gold(), 0, .1, 0, false); add(slab, box(1.7, .02, .6), emi(0xb05cff, .8), 0, .115, 0, false);
  add(slab, cone(.3, .35, 4), st, 0, -.27, 0).rotation.x = Math.PI;                                    // hanging prism underside
  const shards = []; for (let k = 0; k < 5; k++) { const s = add(g, new THREE.OctahedronGeometry(.12), emi(k % 2 ? 0x4fd0ff : 0xb05cff, 1.8), 0, 1.0, 0, false); s.scale.y = 1.7; shards.push(s); }
  const panelM = new THREE.MeshBasicMaterial({ map:runePanel('#7fe3ff'), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, toneMapped:false });
  const panel = add(g, new THREE.PlaneGeometry(1.2, 1.2), panelM, 0, 2.1, -.3, false);
  const pl = new THREE.PointLight(0xb05cff, 2, 4); pl.position.set(0, .5, 0); g.add(pl);
  anim.push(t => { slab.position.y = 1.0 + Math.sin(t*1.2)*.08; slab.rotation.y = Math.sin(t*.4)*.04; disc.rotation.z = t*.3;
    shards.forEach((s, k) => { const a = t*.8 + k/5*6.283; s.position.set(Math.cos(a)*1.25, 1.3 + Math.sin(t*2 + k)*.15, Math.sin(a)*.8); s.rotation.y = t*2; });
    panel.rotation.z = t*.25; panel.position.y = 2.1 + Math.sin(t*1.4)*.04; });
}
// ===== 5. Necromancer Bone Desk =====
{
  const g = station(4, 'โต๊ะกระดูกนักอัญเชิญ (Necro Bone Desk)', 'ขากระดูกซี่โครง กะโหลกตาเขียวเรืองแสง เปลวไฟวิญญาณลอยแทนจอ');
  const bone = std(0xe4dcc4, { roughness:.6 }), wood = std(0x241a2e, { roughness:.5 });
  add(g, box(2, .14, .95), wood, 0, .98, 0); add(g, box(2.06, .04, 1.01), std(0x6b6b78, { metalness:.7, roughness:.35 }), 0, 1.07, 0, false);
  for (const sx of [-.88, .88]) { add(g, cyl(.06, .06, .9, 8), bone, sx, .5, .3); add(g, cyl(.06, .06, .9, 8), bone, sx, .5, -.3); add(g, sph(.1), bone, sx, .95, .3); add(g, sph(.1), bone, sx, .95, -.3); add(g, sph(.09), bone, sx, .06, .3); add(g, sph(.09), bone, sx, .06, -.3);
    for (let r = 0; r < 4; r++) { const rib = add(g, tor(.3, .035, Math.PI), bone, sx, .8 - r*.17, 0, true); rib.rotation.y = Math.PI/2; rib.rotation.z = 0; rib.scale.set(1, 1, 1); } }
  const skull = new THREE.Group(); skull.position.set(.65, 1.2, .2); skull.rotation.y = -.5; g.add(skull);
  add(skull, sph(.17, 18, 14), bone, 0, 0, 0); add(skull, box(.16, .1, .14), bone, 0, -.14, .03);
  for (const sx of [-1, 1]) { add(skull, sph(.045, 10, 8), emi(0x5fff9a, 3), sx*.065, .01, .13, false); }
  const skullL = new THREE.PointLight(0x5fff9a, .8, 2); skullL.position.set(0, 0, .2); skull.add(skullL);
  for (let k = 0; k < 3; k++) { add(g, cyl(.045, .05, .1 + k*.07, 8), std(0xe0d8c0), -.78 + k*.13, 1.16 + (k*.035), .28); flame(g, -.78 + k*.13, 1.26 + k*.07, .28, 0x7dffb0); }
  add(g, cyl(.12, .12, .3, 14), new THREE.MeshPhysicalMaterial({ color:0x9fffd0, transparent:true, opacity:.3, roughness:.05 }), -.45, 1.24, .1, false);
  const jarSoul = add(g, sph(.07, 12, 10), emi(0x7dffb0, 3), -.45, 1.26, .1, false);
  const soul = new THREE.Group(); soul.position.set(0, 2.0, -.25); g.add(soul);
  const sf = []; for (let k = 0; k < 6; k++) { const a = k/6*6.283; const f = add(soul, new THREE.ConeGeometry(.12, .42, 10), emi(0x5fff9a, 2.4, { transparent:true, opacity:.85 }), Math.cos(a)*.5, 0, Math.sin(a)*.18, false); sf.push(f); }
  const core = add(soul, sph(.14, 14, 10), emi(0xbfffe0, 3), 0, 0, 0, false);
  const ringS = add(soul, tor(.55, .012), emi(0x5fff9a, 2), 0, -.25, 0, false); ringS.rotation.x = Math.PI/2;
  const pl = new THREE.PointLight(0x5fff9a, 1.8, 4); pl.position.set(0, 2.0, .2); g.add(pl);
  anim.push(t => { soul.position.y = 2.0 + Math.sin(t*1.3)*.08; soul.rotation.y = t*.5; sf.forEach((f, k) => { f.scale.y = .85 + Math.sin(t*8 + k*1.3)*.25; f.position.y = Math.sin(t*3 + k)*.08; }); jarSoul.position.y = 1.26 + Math.sin(t*2)*.04; core.scale.setScalar(1 + Math.sin(t*5)*.1); });
}

// ---------- loop ----------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); const dz = Math.max(8, 10.6/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect)); camera.position.set(0, 2.6 + dz*.08, dz); controls.update(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(), v = new THREE.Vector3();
(function frame() {
  const t = clock.getElapsedTime();
  flames.forEach((f, i) => f.scale.set(1, .85 + Math.sin(t*10 + i*1.7)*.2, 1));
  anim.forEach(fn => fn(t)); controls.update();
  for (const l of labels) { l.anchor.getWorldPosition(v); v.project(camera); l.el.style.display = v.z < 1 ? '' : 'none'; l.el.style.transform = `translate(${(v.x*.5 + .5)*innerWidth}px,${(-v.y*.5 + .5)*innerHeight}px) translate(0,-100%)`; }
  composer.render(); requestAnimationFrame(frame);
})();
</script>
</body>
