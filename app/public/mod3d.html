<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadline Necromancer — Moderator 3D</title>
<style>
  :root{--bg:#0f0d1a;--panel:#181528;--panel2:#201c36;--line:#33294f;--txt:#ebe7f7;--mut:#a79fc6;
        --light:#f5c451;--dark:#b05cff;--indie:#4ecdc4;--bad:#ff5c7a;--good:#5fe39a;
        --team:#4fd0ff;--cult:#ff4d5e;--seek:#4ee07a;--glass:#120f20e6;--gap:.9rem;--chatH:clamp(11rem,28vh,22rem);--edge:.9rem;
        --z-rows:4;--z-band:5;--z-chat:6;--z-mod:8;--z-modtab:9;--z-bub:60;--z-dbig:650;--z-cap:660;--z-msg:670;--z-stamp:680;--z-lobby:900;--z-flash:950}
  *{box-sizing:border-box}
  /* fluid scale: ~17px on a 1366 laptop, ~21px on 1080p, up to 28px on a 4K TV — every HUD size below is in rem */
  html{font-size:clamp(16px,min(.55vw + 10px,1.1vh + 8px),28px)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
  #c{position:fixed;left:0;right:0;top:0;bottom:var(--chatH);width:100%;height:calc(100% - var(--chatH));display:block}
  button{font:inherit;color:inherit;cursor:pointer}
  /* ---- phase band (Dota pick/ban style): sits between the team rows, y follows the projected altar ---- */
  .band{position:fixed;left:0;right:0;top:var(--bandY,40%);min-height:3.4rem;transform:translateY(-50%);display:grid;grid-template-columns:1fr 9rem 1fr;align-items:center;gap:1rem;padding:.2rem var(--edge);
    background:linear-gradient(90deg,#0b0916f2 0,#17112cd9 calc(50% - 5.5rem),transparent calc(50% - 5rem),transparent calc(50% + 5rem),#17112cd9 calc(50% + 5.5rem),#0b0916f2 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);z-index:var(--z-band);pointer-events:none}
  body:not(.tv) .band{padding-right:3rem}                                                   /* clear of the ⚙ tab */
  .band>*{pointer-events:auto}
  .bandL{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem 1rem;min-width:0}
  .bandR{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem 1rem;justify-content:flex-end;min-width:0}
  .days{display:flex;gap:.25rem}
  .day{padding:.12rem .6rem;border-radius:.4rem;background:var(--panel2);font-size:.95rem;color:var(--mut)}
  .day.now{background:var(--dark);color:#fff} .day.past{opacity:.5}
  .mana{flex:1;max-width:20rem;min-width:8rem}
  .mana .bar{height:.75rem;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .mana .fill{height:100%;background:linear-gradient(90deg,#4f8cff,#9b6bff);transition:width .5s}
  .mana small{color:var(--txt);font-size:1.05rem;font-weight:700;white-space:nowrap}
  #waitTxt{color:var(--mut);font-size:.95rem;white-space:nowrap}
  .phase{font-weight:800;color:var(--light);font-size:1.5rem;white-space:nowrap;line-height:1.1}
  .secbadge{display:none;background:#3a0f18;border:1px solid var(--cult);color:#ffb3bb;border-radius:99px;padding:.1rem .7rem;font-size:.9rem;font-weight:600;white-space:nowrap}
  body.sec .secbadge{display:inline-block}
  /* ---- team rows: HTML side columns follow the projected row positions ---- */
  .rowL,.rowR{position:fixed;top:0;transform:translateY(-50%);z-index:var(--z-rows);display:flex;flex-direction:column;gap:.2rem;pointer-events:none}
  .rowL{left:var(--edge);width:13rem}
  .rowR{display:none}
  .rowL .em{position:relative;width:6rem;height:6rem;animation:pop .4s}
  .rowL .em img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 .25rem .5rem #000b)}
  .rowL .em b{position:absolute;right:-.5rem;bottom:-.1rem;min-width:1.9rem;padding:.02rem .5rem;border-radius:99px;background:#0b0916f2;border:.12rem solid currentColor;font-size:1.05rem;font-weight:800;text-align:center;line-height:1.35}
  .rowL.light{color:var(--team)} .rowL.dark{color:var(--cult)} .rowL.indie{color:var(--seek)}
  /* ---- chat section (bottom) + night log column ---- */
  /* fantasy tavern notice board: wooden beam + frame, a parchment scroll with ink text, wax-seal avatars, hanging title plaque, pinned secret note */
  #chatSec{position:fixed;left:0;right:0;bottom:0;height:var(--chatH);z-index:var(--z-chat);display:flex;gap:1.1rem;padding:1.5rem 2.2rem .7rem;
    background:repeating-linear-gradient(90deg,#3a2414 0 7px,#2f1c10 7px 14px),#2a180d;
    border-top:.55rem solid #6b4423;border-image:linear-gradient(180deg,#9a6a3a,#6b4423 40%,#3a2412) 1;box-shadow:0 -.5rem 1.6rem #000c,inset 0 .35rem .6rem #0006}
  #chatBox{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;padding:.9rem 1.5rem .5rem;border-radius:.35rem .35rem .8rem .8rem;color:#3a2a14;
    background:radial-gradient(140% 120% at 50% 40%,#efe2bb 0,#e2d1a2 55%,#bfa468 100%);
    box-shadow:inset 0 0 1.6rem #6a4a1c99,inset 0 0 .35rem #3a2410,0 .3rem .8rem #000a;border:.18rem solid #5a3b1c}
  #chatBox::before,#chatBox::after{content:"";position:absolute;top:.4rem;width:.5rem;height:.5rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8c49a,#6b5530 70%);box-shadow:0 .1rem .15rem #0008}
  #chatBox::before{left:.5rem} #chatBox::after{right:.5rem}
  #chatBox .lh{position:absolute;left:50%;top:-1.05rem;transform:translateX(-50%);z-index:2;padding:.18rem 1.6rem;border:.16rem solid #3a2412;border-radius:.3rem;background:linear-gradient(180deg,#8a5a2e,#5e3a1c);box-shadow:0 .25rem .5rem #000a,inset 0 .1rem .1rem #c9965a66;
    font:800 .82rem/1.2 "Palatino Linotype","Book Antiqua",Georgia,"Noto Serif Thai",serif;letter-spacing:.04em;color:#ffd98a;text-shadow:0 .1rem .15rem #000;white-space:nowrap}
  #chatBox .lh::before,#chatBox .lh::after{content:"";position:absolute;top:-.6rem;width:.14rem;height:.7rem;background:linear-gradient(180deg,#9aa0a8,#4a4f57)}
  #chatBox .lh::before{left:22%} #chatBox .lh::after{right:22%}
  #chatBox .lh i{font-style:normal;margin-left:.9rem;font-weight:600;letter-spacing:.03em;text-transform:none;color:#e7c98e}
  #chatLog{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.1rem;padding:.2rem .5rem 0 0;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#8a6a3a transparent;font-family:"Palatino Linotype","Book Antiqua",Georgia,"Noto Serif Thai","Sarabun",serif}
  #chatLog .m{display:grid;grid-template-columns:1.9rem 1fr;gap:.6rem;align-items:start;padding:.14rem 0;animation:chatIn .35s ease-out both}
  #chatLog .m:not(.cont){border-top:1px dashed #8a6a3a99} #chatLog .m:first-child{border-top:0}
  #chatLog .m.cont .av{visibility:hidden} #chatLog .m.cont .nm{display:none}
  #chatLog .av{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#fff4d6;background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 72%);box-shadow:inset 0 -.15rem .25rem #0006,inset 0 .1rem .15rem #fff5,0 .12rem .22rem #0007,0 0 0 .12rem var(--c1);text-shadow:0 1px 2px #0009}   /* wax seal */
  #chatLog .nm{font-size:.95rem;font-weight:800;color:var(--c3);line-height:1.1} #chatLog .nm small{margin-left:.5rem;font-weight:500;color:#5a4526;font-size:.8rem}
  #chatLog .tx{margin-top:.06rem;color:#2e2010;font-size:1.15rem;line-height:1.35;overflow-wrap:anywhere}
  #chatLog .tx.emo{font-size:1.7rem;line-height:1.1}
  #chatLog:empty::before{content:"🕯 ยังไม่มีใครพูดในห้องประชุม…";color:#5a4526;font-size:1rem;font-style:italic;padding:.4rem .2rem}
  @keyframes chatIn{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
  #nlog{position:relative;width:min(30rem,38vw);flex:none;overflow:auto;background:linear-gradient(180deg,#241218f2,#170c12f2);border:.18rem solid #5a3b1c;border-radius:.4rem;padding:.5rem .7rem;font-size:.8rem;display:none;box-shadow:inset 0 0 1rem #000a,0 .3rem .8rem #000a}
  body.sec #nlog.has{display:block}
  body.nlogoff #nlog{display:none!important}
  #nlog .lh{position:sticky;top:-.5rem;margin:-.5rem -.7rem .3rem;padding:.4rem .7rem;background:#181528;border-bottom:1px solid var(--line);border-radius:.8rem .8rem 0 0;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-weight:600}
  #nlog .lh button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:.9rem;padding:0 .25rem} #nlog .lh button:hover{color:var(--txt)}
  .ln{padding:.12rem 0 .12rem .5rem;border-left:3px solid var(--line);margin:.12rem 0;color:var(--txt)}
  .ln.light{border-color:var(--team)} .ln.dark{border-color:var(--cult)} .ln.indie{border-color:var(--seek)} .ln.sys{border-color:var(--light);color:var(--light);font-weight:600}
  .ln.dchat{border-color:var(--cult);color:#ffc9cf}
  /* ---- moderator tools: slide-in panel on the right edge (never rendered in ?view=tv) ---- */
  #modTab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:var(--z-modtab);background:var(--panel2);border:1px solid var(--line);border-right:0;border-radius:.6rem 0 0 .6rem;padding:.9rem .35rem;writing-mode:vertical-rl;font-size:.9rem;opacity:.75;transition:.2s}
  #modTab:hover,#modTab:focus-visible,body.modopen #modTab{opacity:1}
  #modPanel{position:fixed;right:0;top:0;bottom:var(--chatH);width:min(19rem,80vw);z-index:var(--z-mod);background:var(--glass);border-left:.18rem solid #5a3b1c;backdrop-filter:blur(8px);padding:1rem;display:flex;flex-direction:column;gap:.5rem;transform:translateX(105%);visibility:hidden;transition:transform .3s,visibility 0s .3s;overflow:auto}
  body.modopen #modPanel{transform:none;visibility:visible;transition-delay:0s}
  #modPanel h3{margin:0 0 .3rem;font-size:.95rem;color:var(--mut)}
  #modPanel .btn{width:100%;text-align:left}
  body.tv #modTab,body.tv #modPanel,body.tv #startBtn,body.tv #lobby a{display:none!important}
  .btn{background:var(--panel2);border:1px solid var(--line);padding:.45rem .9rem;border-radius:.55rem;transition:.15s;font-size:.9rem;text-decoration:none;color:var(--txt)}
  .btn:hover,.btn:focus-visible{border-color:var(--dark);background:#2a2447}
  .btn:focus-visible,#modTab:focus-visible{outline:.18rem solid var(--light);outline-offset:.15rem}
  .btn.on{background:linear-gradient(135deg,#7c3aed,#b05cff);border:0;font-weight:600;font-size:1rem;padding:.55rem 1.2rem;box-shadow:0 .2rem 1rem #7c3aed66}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  #flash{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .6s;z-index:var(--z-flash)}
  #msg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:700;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:var(--z-msg);max-width:90vw}
  .tag{position:fixed;left:0;top:0;pointer-events:none;width:var(--tagW,6rem);padding:.08rem .35rem;background:#0b0916e0;border:1px solid #3a2f5c;border-left:.25rem solid #5a4a86;border-radius:.3rem;color:var(--txt);font-weight:700;font-size:.9rem;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:var(--z-rows)}
  .tag:empty{display:none}
  .dbadge{position:fixed;left:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;pointer-events:none;z-index:var(--z-rows)}
  .dbadge:empty{display:none}
  .dbadge span{min-width:1.55rem;height:1.55rem;padding:0 .3rem;display:grid;place-items:center;border-radius:99px;background:#0b0916ee;border:.13rem solid #d8b050;box-shadow:0 .1rem .4rem #000c;font-size:.95rem;line-height:1;white-space:nowrap;animation:pop .3s}
  .tag.light{border-left-color:var(--team)} .tag.dark{border-left-color:var(--cult)} .tag.indie{border-left-color:var(--seek)} .tag.out{opacity:.7;color:#b4b0c6}
  /* ---- caption: broadcast lower-third above the dock, clear of the characters ---- */
  #cap{position:fixed;left:50%;bottom:calc(var(--chatH) + .8rem);transform:translateX(-50%) translateY(.5rem);width:min(40rem,60vw);background:var(--glass);border:1px solid var(--line);border-left:.3rem solid var(--light);border-radius:.8rem;padding:.35rem .9rem;z-index:var(--z-cap);opacity:0;pointer-events:none;transition:.35s;white-space:pre-line}
  #cap div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  body.modopen #cap{left:calc(50% - 9.5rem)}
  #cap.over{top:var(--bandY,40%);bottom:auto;width:min(34rem,70vw);padding:.8rem 1.4rem;background:#0b0916f5;border-width:.2rem;border-left-width:.35rem}
  #cap.over.show{transform:translate(-50%,-50%)} #cap.over b{font-size:1.6rem} #cap.over div{font-size:1.15rem;-webkit-line-clamp:4}
  #cap.show{opacity:1;transform:translateX(-50%)}
  #cap b{display:block;font-size:1.1rem;margin-bottom:.1rem;color:var(--light)} #cap div{font-size:.95rem;color:var(--txt)}
  #cap.trap{border-left-color:var(--cult)} #cap.trap b{color:var(--cult)} #cap.boost b{color:var(--light)} #cap.evt{border-left-color:var(--team)} #cap.evt b{color:var(--team)}
  /* ---- right rail: event chips (max 3, auto-expire) ---- */
  #chips{position:fixed;right:14rem;top:calc(var(--bandY,40%) + 2.4rem);display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;z-index:var(--z-cap);max-width:24rem}
  body.modopen #chips{right:20rem}
  .chip{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:.25rem .8rem;font-size:.95rem;animation:pop .4s}
  .chip.evt{border-color:var(--team);color:var(--team)} .chip.trap{border-color:var(--cult);color:var(--cult)} .chip.boost{border-color:var(--light);color:var(--light)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  /* ---- lobby: room code, join URL, live roster ---- */
  #lobby{position:fixed;inset:0;z-index:var(--z-lobby);display:grid;place-items:center;text-align:center;background:radial-gradient(900px 500px at 50% 0,#2a1f4d,#0f0d1a);padding:1.5rem;overflow:auto}
  #lobby h2{margin:0 0 .3rem;font-size:1.6rem} #lobby p{color:var(--mut);margin:.4rem 0}
  #lobbyCode{font-size:4.2rem;font-weight:800;letter-spacing:.35em;padding-left:.35em;color:var(--light);line-height:1.1;text-shadow:0 0 1.5rem #f5c45155;font-variant-numeric:tabular-nums}
  #lobbyUrl{font-size:1.1rem;color:var(--txt);word-break:break-all}
  #lobbyCount{font-weight:700;color:var(--txt)}
  #roster{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:46rem;margin:.6rem auto 1rem}
  #roster span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:.2rem .8rem;font-size:.95rem}
  #lobbyWhy{min-height:1.4em;font-size:.9rem}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  @media (max-width:900px){.band{grid-template-columns:1fr 5rem 1fr}.rowL,.rowR{display:none}#lobbyCode{font-size:3rem}}
</style>
<script src="/data.js"></script>
<script src="/socket.io/socket.io.js"></script>

<body>
<canvas id="c"></canvas>
<div class="band" id="band">
  <div class="bandL"><div class="phase" id="phase">ประชุมเช้า</div><div class="days" id="days"></div><span id="waitTxt"></span></div>
  <div></div>
  <div class="bandR"><span class="secbadge" id="secBadge">👁 เปิดบทบาทลับ</span><div class="mana"><div class="bar"><div class="fill" id="fill"></div></div><small id="manaTxt"></small></div></div>
</div>
<div id="rowSides"></div>
<div id="cap"><b id="capT"></b><div id="capD"></div></div><div id="chips"></div><div id="msg"></div><div id="flash"></div>
<section id="chatSec">
  <div id="chatBox"><div class="lh"><span>📜 บันทึกการประชุมเช้า</span><i id="chatMeta"></i></div><div id="chatLog" aria-live="polite"></div></div>
  <div id="nlog"><div class="lh"><span>📜 Night Log &amp; แชทลับ (Moderator เท่านั้น)</span><span><button id="nlogClear" title="ล้างบันทึก">🗑</button><button id="nlogHide" title="ซ่อน">✕</button></span></div></div>
</section>
<button id="modTab" title="เครื่องมือ Moderator (กด M)" aria-controls="modPanel" aria-expanded="false">⚙ เครื่องมือ MOD</button>
<aside id="modPanel" role="dialog" aria-label="เครื่องมือ Moderator">
  <h3>เครื่องมือ Moderator</h3>
  <button class="btn on" id="nextStep" style="display:none"></button>
  <button class="btn" id="closeEv" style="display:none"></button>
  <button class="btn" id="closeBo" style="display:none"></button>
  <button class="btn" id="secretLive" title="เปิด/ปิดการแสดงสีฝ่าย บทบาท และ Night Log บนจอนี้ (ปิดไว้เป็นค่าเริ่มต้น เพื่อไม่ให้ผู้เล่นเห็น)">👁 แสดงบทบาทลับ: ปิด</button>
  <button class="btn" id="nlogBtn">📜 Night Log: แสดง</button>
  <a class="btn" href="/mod">📋 หน้าควบคุมเต็ม</a>
  </aside>
<div id="legacy" style="display:none">
  <button data-p="MORNING"></button><button data-p="VOTE"></button><button data-p="NIGHT"></button>
  <button id="fire"></button><button id="burn"></button><button id="mp"></button><button id="mm"></button><button id="next"></button><button id="reroll"></button><button id="secret"></button>
</div>
<div id="lobby"><div>
  <h2>🧙 Deadline Necromancer — Moderator 3D</h2>
  <p>รหัสห้อง</p>
  <div id="lobbyCode">—</div>
  <p id="lobbyUrl"></p>
  <p id="lobbyCount"></p>
  <div id="roster"></div>
  <p id="lobbyTxt"></p>
  <p id="lobbyWhy"></p>
  <p><button class="btn on" id="startBtn" disabled style="display:none">▶ เริ่มเกม</button> <a class="btn" href="/mod">หน้า Moderator เต็ม</a></p>
</div></div>
<script type="module">

// =====================================================================

const CARD_DIR = '/thumbs/roles/';
const FCOL = { light:0x4fd0ff, dark:0xff4d5e, indie:0x4ee07a };           // card-frame colours (Team / Cult / Seekers)
const EMBLEM = { light:'team_deliver', dark:'cult_of_burnout', indie:'severance_seeker' };
const FTH = { light:'Team Deliver', dark:'Cult of Burnout', indie:'Severance Seekers' };
const ROLE = {
  // ---- Team Deliver (blue / silver / cyan) ----
  senior_dev:       { n:'Senior Dev', f:'light', img:'team_deliver/01_senior_dev.png',
    look:{ hair:0x15151c, style:'messy', coat:0x1c2c5a, trim:0x4fd0ff, acc:['headphones','cat','can','hoodie'] } },
  oracle_pm:        { n:'Oracle PM', f:'light', img:'team_deliver/02_oracle_pm.png',
    look:{ hair:0x1c2f78, style:'bob', coat:0x1c3470, trim:0x4fd0ff, acc:['glasses','pen'] } },
  qa_hunter:        { n:'QA Hunter', f:'light', img:'team_deliver/03_qa_hunter.png',
    look:{ hair:0x15151c, style:'long', coat:0x6a4228, trim:0xd8b050, acc:['fedora','magnifier'] } },
  rune_ux:          { n:'Rune UX/UI', f:'light', img:'team_deliver/04_rune_ux_ui.png',
    look:{ hair:0xf0c888, style:'bob', coat:0x2ab5a8, trim:0xd8b050, acc:['roundglasses','elf','hairclip'] } },
  data_oracle:      { n:'Data Oracle', f:'light', img:'team_deliver/05_data_oracle.png',
    look:{ hair:0x1a2870, style:'hood', coat:0x1c2468, trim:0x4fd0ff, eye:0x8ff0ff, acc:['orb','galaxy'] } },
  chrono_tech_lead: { n:'Chrono Tech Lead', f:'light', img:'team_deliver/06_chrono_tech_lead.png',
