<!DOCTYPE html>
<html lang="th">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&family=Noto+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline Necromancer — Moderator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/data.js"></script>
<script src="/audio.js"></script>
<script src="/common.js"></script>
<script src="/qrcode.js"></script>
<script>
const socket = io();
let S = null, session = null, error = '';
const adoptHash = () => { try { const m = /^#room=([A-Za-z0-9]+):([A-Za-z0-9]+)$/.exec(location.hash); if (m) { localStorage.setItem('dn-mod', JSON.stringify({ code: m[1].toUpperCase(), modToken: m[2] })); history.replaceState(null, '', location.pathname + location.search); } } catch {} };   // #room=CODE:TOKEN link (e.g. from tools/play-bots.js) → adopt as this browser's moderator session
adoptHash();
const saved = () => { try { return JSON.parse(localStorage.getItem('dn-mod') || 'null'); } catch { return null; } };

socket.on('connect', async () => {
  const s = saved();
  if (s) { const r = await emit(socket, 'mod:join', s); if (r.ok) session = s; else localStorage.removeItem('dn-mod'); }
  render();
});
socket.on('state', st => { S = st; setTimerFrom(st); render(); DNAudio.onState(st); });

let needPw = false;   // set when the server answers that MOD_PASSWORD is required
async function createRoom() {
  const password = needPw ? ($('#mpw')?.value || '') : undefined;
  const r = await emit(socket, 'mod:create', { password });
  if (!r.ok) { needPw = !!r.needPassword; error = r.error || 'สร้างห้องไม่สำเร็จ'; return render(); }
  needPw = false; error = '';
  session = { code: r.code, modToken: r.modToken }; localStorage.setItem('dn-mod', JSON.stringify(session));
}
function leaveRoom() { localStorage.removeItem('dn-mod'); session = null; S = null; render(); }
async function doAct(action, payload) {
  const r = await emit(socket, 'mod:do', { action, payload });
  error = r.ok ? '' : r.error; if (!r.ok) render();
}
let lanHost = '';   // LAN IP from /lan-ip, used in place of localhost so phones can reach the join link
const joinUrl = () => (isLocalHost() && lanHost ? location.protocol + '//' + lanHost + (location.port ? ':' + location.port : '') : location.origin) + '/?room=' + session.code;
function announce(e) { e.preventDefault(); const i = $('#annIn'); const t = i.value.trim(); if (!t) return; i.value = ''; doAct('announce', { text: t }); }
const isLocalHost = () => /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
function joinQR() {   // QR of the join link (vendored qrcode.js, no network); phones can't reach localhost, so warn
  try { const q = qrcode(0, 'M'); q.addData(joinUrl()); q.make(); return `<div class="joinqr" style="background:#fff;padding:10px;border-radius:12px;width:min(260px,70vw);margin:0 auto 12px" role="img" aria-label="QR เข้าห้อง ${esc(session.code)}">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>${isLocalHost() && !lanHost ? '<div class="banner warn">เปิดหน้านี้ผ่าน localhost — โทรศัพท์สแกนแล้วเข้าไม่ได้ ให้เปิด /mod ด้วย IP ของเครื่องแทน (เช่น https://192.168.x.x:3000/mod)</div>' : ''}`; } catch { return ''; }
}
const copyUrl = () => navigator.clipboard?.writeText(joinUrl());
// ยืนยันแบบกดซ้ำในหน้า (ไม่ใช้ confirm() เพราะเบราว์เซอร์ฝังบางตัว เช่น Browser pane ของ Claude, บล็อก dialog แล้วปุ่มจะไม่ทำงานเลย)
let armed = null;
const confirmDo = (msg, a, p, btn) => {
  if (armed === a) { armed = null; return doAct(a, p); }
  armed = a; const old = btn.textContent; btn.textContent = '⚠️ กดอีกครั้งเพื่อยืนยัน — ' + msg;
  setTimeout(() => { if (armed === a) { armed = null; btn.textContent = old; } }, 4000);
};

function render() {
  const app = $('#app');
  const focus = document.activeElement?.id, val = document.activeElement?.value;
  const oc = $('#modchat'), keepBottom = !oc || oc.scrollHeight - oc.scrollTop - oc.clientHeight < 40, oldTop = oc?.scrollTop;
  if (!session || !S) app.innerHTML = startHTML();
  else if (S.phase === 'LOBBY') app.innerHTML = lobbyHTML();
  else app.innerHTML = gameHTML();
  const nc = $('#modchat'); if (nc) nc.scrollTop = keepBottom ? nc.scrollHeight : oldTop;
  if (focus && $('#' + focus) && val !== undefined) { const el = $('#' + focus); el.value = val; el.focus(); }
  const tb = $('.top'); if (tb) document.documentElement.style.setProperty('--topH', tb.getBoundingClientRect().height + 'px');
  tickTimer();
}
function startHTML() {
  return `<div class="setup"><h1>🎛️ Moderator</h1><p>สร้างห้องใหม่ แล้วแจกรหัสห้องให้ผู้เล่น (Moderator ไม่ได้เล่น — ควบคุมจังหวะเกมเท่านั้น)</p>
    ${error ? `<div class="banner warn">${esc(error)}</div>` : ''}${needPw ? '<form onsubmit="event.preventDefault();createRoom()" style="margin:8px 0"><input id="mpw" type="password" placeholder="รหัสผ่าน Moderator" autocomplete="current-password" style="font-size:16px"></form>' : ''}<button class="btn primary bigbtn" onclick="createRoom()">สร้างห้องใหม่</button></div>`;
}
function lobbyHTML() {
  const n = S.players.length, ok = n >= S.min && n <= S.max;
  return `<div class="setup" style="max-width:640px"><h1>🪑 ล็อบบี้</h1>
    <p>ให้ผู้เล่นสแกน QR เปิดลิงก์ หรือกรอกรหัสห้อง</p>
    <div class="code">${esc(S.code)}</div>
    ${joinQR()}
    <div class="row" style="margin:8px 0 18px"><code class="pill">${esc(joinUrl())}</code><button class="btn" onclick="copyUrl()">คัดลอกลิงก์</button></div>
    ${error ? `<div class="banner warn">${esc(error)}</div>` : ''}
    <div class="plist">${S.players.map(p => `<div class="pl"><div class="av">${esc(p.name[0])}</div><div class="nm" style="flex:1">${esc(p.name)} ${p.connected ? '<span class="ok">●</span>' : '<span class="mut">○ ออฟไลน์</span>'}</div><button class="btn" onclick="doAct('kick',{name:'${esc(p.name)}'})">เตะ</button></div>`).join('') || '<p class="hint">ยังไม่มีผู้เล่น</p>'}</div>
    <p class="hint" style="margin-top:12px">ผู้เล่น ${n} คน · ต้องมี ${S.min}–${S.max} คน · ไม่มีบอท ต้องเป็นคนจริงทั้งหมด</p>
    <div class="row" style="margin-top:16px"><button class="btn primary bigbtn" ${ok ? '' : 'disabled'} onclick="doAct('start')">เริ่มเกม</button><button class="btn" onclick="leaveRoom()">ออกจากห้องนี้</button></div></div>`;
}

const ACTIONS = {
  MORNING: { label: 'ไปเฟสโหวตไล่ออก →', act: 'toVote' },
  VOTE: { label: 'ปิดโหวตและประกาศผล', act: 'closeVote' },
  VOTE_INTERIM: { label: 'เปิดโหวตรอบสอง →', act: 'openRound2' },
  VOTE_RESULT: { label: 'เข้าสู่กลางคืน 🌙', act: 'toNight' },
  NIGHT: { label: 'ปิดกลางคืนและประมวลผล ☀️', act: 'closeNight' },
  OVER: { label: 'เริ่มห้องใหม่ (ผู้เล่นชุดเดิม)', act: 'reset' },
};
function progress(p, label) {
  if (!p) return '';
  const pct = p.total ? Math.round(p.done / p.total * 100) : 100;
  return `<div style="margin:8px 0"><b>${label}</b> ${p.done}/${p.total}<div class="progress"><div style="width:${pct}%"></div></div>${p.done >= p.total ? '<div class="ok hint">ครบแล้ว ✅</div>' : p.waiting ? `<div class="hint">ยังไม่ส่ง: ${p.waiting.map(esc).join(', ')}</div>` : `<div class="hint">ยังรอ ${p.total - p.done} คน (ชื่อแสดงเมื่อเปิดโหมดข้อมูลลับ)</div>`}</div>`;
}
// ---------- tabs ----------
const TABS = [['match', '🏆 การแข่งขัน'], ['players', '👥 ผู้เล่นในเกม'], ['chat', '💬 Chat']];
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } };
let TAB = lsGet('dn-mod-tab', 'match'); if (!TABS.some(t => t[0] === TAB)) TAB = 'match';
const setTab = t => { TAB = t; lsSet('dn-mod-tab', t); render(); };
const chatMsgs = () => (S.feed || []).filter(m => m.kind === 'chat');   // เฉพาะข้อความผู้เล่น (แชทลับทีมมืดไม่อยู่ใน feed)
const seenKey = () => 'dn-mod-seen-' + (session?.code || '');
function unreadChat() {
  const n = chatMsgs().length;
  if (TAB === 'chat') { lsSet(seenKey(), String(n)); return 0; }
  const seen = Number(lsGet(seenKey(), '0'));
  if (n < seen) { lsSet(seenKey(), String(n)); return 0; }
  return n - seen;
}
function manaHTML() {
  const pct = S.manaMax && S.mana != null ? Math.min(100, Math.round(S.mana / S.manaMax * 100)) : 0;
  return `<div class="card"><h3>Mana Task</h3><div class="manabig">${S.manaHidden || S.mana == null ? '<b>??</b><span>หน้าสถานะล่ม · เปิด Secrets เพื่อดู</span>' : `<b>${S.mana}</b><span>/ ${S.manaMax}</span>`}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="hint" style="margin-top:8px">Skip ติดกัน ${S.skipStreak} · โควตา Booster ${S.boosterCharges}${S.hijackSet ? ' · Meeting Hijack ทำงาน' : ''}</div></div>`;
}
function playerCardsHTML() {
  return `<div class="pcards">${S.players.map(p => {
    const r = p.role && ROLES[p.role];
    const art = r ? `<img src="${ROLETHUMB_MD + r.img}" alt="${esc(r.n)}" loading="lazy" onclick="window.open(IMG + '${r.img}')">` : `<div class="cardback"><span>?</span></div>`;
    const st = p.alive ? '' : `<span class="tag">${CAUSE[p.cause] || 'ออกจากเกม'}</span>`;
    return `<div class="pcard ${p.faction || ''} ${p.alive ? '' : 'out'}">${art}<div class="pname">${esc(p.name)}</div>
      <div class="psub">${r ? `<span class="tag ${p.faction}">${esc(r.n)}</span>` : ''}${st}${p.alive && p.silenced ? '<span class="tag">🤐 ปิดปาก</span>' : ''}</div></div>`;
  }).join('')}</div>`;
}
function chatTabHTML() {
  const rows = (S.feed || []).map(m => m.kind === 'sys' ? `<div class="msg sys">${esc(m.text)}</div>`
    : m.kind === 'chat' ? `<div class="msg"><b>${esc(m.name)}:</b> ${esc(m.text)} <small class="mut">${new Date(m.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</small></div>` : '').join('');
  return `<div class="card"><h3>แชทผู้เล่นทั้งหมด (ไม่รวมแชทลับทีมมืด)</h3><div class="chat modchat" id="modchat">${rows || '<div class="hint">ยังไม่มีข้อความ</div>'}</div></div>`;
}
function gameHTML() {
  const interim = S.phase === 'VOTE_INTERIM';
  const g0 = S.guidance || {};
  const g = { title: g0.title || (interim ? 'พักรอบโหวต — คะแนนรอบแรก' : ''), steps: g0.steps || (interim ? ['แจกจ่ายให้ผู้เล่นคุยกันก่อน แล้วกด "เปิดโหวตรอบสอง"'] : []), next: g0.next || '' };
  const a = S.phase === 'MORNING' && S.day === 1 ? { label: 'ข้ามโหวต (วันจันทร์ไม่มีโหวตไล่ออก) →', act: 'toVote' } : S.phase === 'VOTE' && S.voteRound === 1 ? { label: 'ปิดโหวตรอบแรก (ยังไม่ไล่ใคร)', act: 'closeVote' } : ACTIONS[S.phase], pd = S.pending || {};
  const voteLabel = S.voteRound === 1 ? 'โหวตรอบแรก' : S.voteRound === 2 ? 'โหวตรอบสอง' : 'โหวตไล่ออก';
  const statusRep = Array.isArray(S.statusReport) ? `<div class="report"><div><b>🛠️ รายงานเต็ม (เฉพาะผู้ดำเนินเกม + วิศวกรเวร):</b></div>${S.statusReport.length ? S.statusReport.map(r => `<div>${esc(r)}</div>`).join('') : '<div class="hint">เมื่อคืนไม่มีอะไรผิดปกติ</div>'}${S.onCall != null && S.players[S.onCall] ? `<div class="hint">🛠️ วิศวกรเวร: ${esc(S.players[S.onCall].name)}</div>` : ''}</div>` : '';
  const interimBox = interim ? interimVotesHTML(S) : '';
  const timers = [60, 120, 180, 300].map(t => `<button class="btn" onclick="doAct('timer',{sec:${t}})">${t >= 60 ? t / 60 + ' นาที' : t + ' วิ'}</button>`).join('');
  const tl = S.timeline.slice().reverse().map((t, i) => `<div class="tl ${i === 0 ? 'cur' : ''}"><small>วัน${DAYS[t.day - 1] || ''} · ${new Date(t.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</small><br><b>${esc(t.title)}</b>${t.text ? `<br><span class="mut">${esc(t.text)}</span>` : ''}</div>`).join('');
  const extraTags = p => S.secrets ? [p.credit ? `<span class="tag">⭐${p.credit}</span>` : '', p.zero ? '<span class="tag">📉0</span>' : '', p.locked ? '<span class="tag">🔒</span>' : ''].filter(Boolean) : [];
  const mainBtn = a ? `<button class="btn primary bigbtn" onclick="${a.act === 'reset' ? "confirmDo('จะกลับไปล็อบบี้ด้วยผู้เล่นชุดเดิม','reset',undefined,this)" : `doAct('${a.act}')`}">${a.label}</button>` : '';
  const side = [];
  if (S.event?.pending) side.push(`<button class="btn" onclick="doAct('closeEvent')">ปิดโหวตการ์ดเหตุการณ์</button>`);
  if (S.boosterOpen && S.phase === 'MORNING') side.push(`<button class="btn" onclick="doAct('closeBooster')">ปิดโหวต Sprint Booster</button>`);
  const secretInfo = S.secrets ? `<div class="card"><h3>🔒 ข้อมูลลับ</h3><div class="hint">Trap ที่หมอบอยู่: ${S.traps.length ? S.traps.map(t => (TRAPS[t.kind]?.n || t.kind) + (t.target != null ? ' → ' + esc(S.players[t.target]?.name) : '')).join(', ') : 'ไม่มี'} · โควตา Trap ${S.trapCharges}</div>
    ${S.nightActions ? `<div class="intel">${S.players.filter(p => S.nightActions[p.id]).map(p => { const n = S.nightActions[p.id]; return `<div><b>${esc(p.name)}</b> ${esc(ROLES[p.role]?.n || '')}: ${n.type}${n.targets?.length ? ' → ' + n.targets.map(t => esc(S.players[t]?.name)).join(',') : ''}${n.side ? ' + ' + n.side + (n.trapId ? ':' + n.trapId : '') + (n.sideTargets?.length ? ' → ' + n.sideTargets.map(t => esc(S.players[t]?.name)).join(',') : '') : ''}</div>`; }).join('')}</div>` : ''}</div>` : '';
  const evInfo = S.event ? eventCardHTML(S.event, S.event.pending ? `<p class="hint">รอโหวต: ${pd.event ? pd.event.done + '/' + pd.event.total : ''}</p>` : (S.event.choice ? `<p class="hint">ผลโหวต: <b>${esc(S.event.accepted ? S.event.yes : S.event.no)}</b></p>` : '')) : '';
  const unread = unreadChat();
  const tabBar = `<div class="mtabs">${TABS.map(([k, l]) => `<button class="mtab ${TAB === k ? 'on' : ''}" onclick="setTab('${k}')">${l}${k === 'chat' && unread ? `<span class="mtab-badge">${unread}</span>` : ''}</button>`).join('')}<span class="mtab-sp"></span>${mainBtn}</div>`;
  const matchTab = `<div class="modgrid">
      <div class="center-col">${manaHTML()}${evInfo ? `<div class="card"><h3>Event Card วันนี้</h3>${evInfo}</div>` : ''}<div class="card"><h3>ลำดับเหตุการณ์ (ล่าสุดอยู่บน)</h3><div class="timeline">${tl}</div></div></div>
      <div class="center-col"><div class="card"><h3>ควบคุมห้อง</h3>
        <div class="row"><span class="mut">ตั้งเวลา (ผู้เล่นเห็นนับถอยหลัง ไม่เปลี่ยนเฟสอัตโนมัติ):</span>${timers}<button class="btn" onclick="doAct('timer',{sec:0})">ยกเลิกเวลา</button></div>
        <div class="row" style="margin-top:10px"><button class="btn" onclick="doAct('pause',{on:${!S.paused}})">${S.paused ? '▶️ เล่นต่อ' : '⏸️ พักเกม'}</button>
          <button class="btn" onclick="doAct('secrets',{on:${!S.secrets}})">${S.secrets ? '🙈 ซ่อนข้อมูลลับ' : '👁️ แสดงข้อมูลลับ (บทบาททุกคน)'}</button></div>
        <form class="chatbar" onsubmit="announce(event)"><input id="annIn" placeholder="ประกาศข้อความถึงทุกคน…" autocomplete="off"><button class="btn" type="submit">📣 ประกาศ</button></form></div>
        ${secretInfo}</div></div>`;
  const body = TAB === 'players' ? `<div class="card"><h3>พนักงาน (${S.players.filter(p => p.alive).length}/${S.players.length}) · ห้อง ${esc(session.code)}${S.secrets ? '' : ' · บทบาทซ่อนอยู่'}</h3>${playerCardsHTML()}</div>` : TAB === 'chat' ? chatTabHTML() : matchTab;
  return topbar(S, `<button class="btn" onclick="leaveRoom()">ออก</button>`) + `<div class="modpage">
    ${error ? `<div class="banner warn">${esc(error)}</div>` : ''}
    ${S.over ? overHTML(S) : ''}
    <div class="card stage"><h3>ตอนนี้</h3><h2>${esc(g.title)}</h2>
      <div class="hint">สิ่งที่ต้องแจ้งผู้เล่น:</div><ol class="steps">${g.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
      ${statusRep}${interimBox}
      ${progress(pd.event, 'โหวตการ์ดเหตุการณ์')}${progress(pd.booster, 'โหวต Sprint Booster')}${progress(pd.vote, voteLabel)}${progress(pd.night, 'ส่งแอ็กชันกลางคืน')}
      <div class="next">👉 <b>ขั้นตอนถัดไป:</b> ${esc(g.next)}</div>
      ${side.length ? `<div class="row" style="margin-top:10px">${side.join('')}</div>` : ''}</div>
    ${tabBar}
    <div class="modbody">${body}</div></div>`;
}
render();
if (isLocalHost()) fetch('/lan-ip').then(r => r.json()).then(j => { if (j.ips && j.ips[0]) { lanHost = j.ips[0]; render(); } }).catch(() => {});
</script>
</body>
</html>
